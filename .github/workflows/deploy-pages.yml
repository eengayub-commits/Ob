# نشر الموقع تلقائياً على GitHub Pages
name: نشر الموقع

on:
  push:
    branches:
      - main
      - claude/burj-al-qimma-factory-website-f5m401
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تهيئة GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
