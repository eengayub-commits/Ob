<title>ملفات عملاء برج القمة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: sticky steel top bar, summary strip, then a file register table; a client opens as a folder with tabbed sections. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#16202a; --muted:#5a6774; --line:#d3dae1;
  --accent:#1d5d78; --accent-soft:#dcebf2; --accent-ink:#ffffff; --bronze:#8f6234;
  --ok:#2b7a4b; --ok-soft:#dff1e6; --warn:#a96300; --warn-soft:#fbecd5; --bad:#b0281f; --bad-soft:#f8dedb;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --f-head:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#161f26; --surface-2:#1b262e; --ink:#e4eaef; --muted:#93a2ae; --line:#2a3741;
  --accent:#5eb0d1; --accent-soft:#183746; --accent-ink:#06141b; --bronze:#d3a26e;
  --ok:#62c48f; --ok-soft:#173527; --warn:#e5a54a; --warn-soft:#3a2b14; --bad:#f07b72; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#161f26; --surface-2:#1b262e; --ink:#e4eaef; --muted:#93a2ae; --line:#2a3741;
  --accent:#5eb0d1; --accent-soft:#183746; --accent-ink:#06141b; --bronze:#d3a26e;
  --ok:#62c48f; --ok-soft:#173527; --warn:#e5a54a; --warn-soft:#3a2b14; --bad:#f07b72; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.3}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--bronze));flex:none;position:relative}
.mark::after{content:"";position:absolute;inset:7px;border:2px solid var(--surface);border-radius:3px}
.brand h1{font-size:1.1rem}.brand small{display:block;color:var(--muted);font-size:.78rem;font-weight:400;font-family:var(--f-body)}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.9rem}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad)}button.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
button.ghost{border-color:transparent;background:transparent;padding:4px 8px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:1rem;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:.82rem}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";direction:ltr;unicode-bidi:isolate}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-head);font-size:1.35rem;font-weight:600}
.stat span{font-size:.8rem;color:var(--muted)}
.cur{font-size:.75rem;color:var(--muted);margin-inline-start:4px;font-weight:400}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:.78rem;letter-spacing:.02em}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-soft)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.76rem;font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.s1{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.s2{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.s3{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:180px}.toolbar select{width:auto}
.split{display:grid;gap:20px;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.inst-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.inst-list li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.inst-list li:last-child{border-bottom:0}
.date-chip{flex:none;width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0;line-height:1.2;background:var(--surface-2)}
.date-chip b{display:block;font-family:var(--f-head);font-size:1.1rem}.date-chip span{font-size:.7rem;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.head h2{font-size:1.5rem}
.fileno{font-family:var(--f-head);color:var(--bronze);font-weight:600;font-size:.9rem}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;white-space:nowrap;color:var(--muted);padding:10px 12px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .cnt{font-size:.72rem;background:var(--surface-2);border-radius:99px;padding:0 7px;border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);min-width:0}
.file a{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;text-decoration:none}
.file a:hover{color:var(--accent);text-decoration:underline}
.ext{font-size:.68rem;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);flex:none;direction:ltr}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.gallery{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.ph{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in;background:var(--surface-2);display:block}
.ph div{padding:6px 10px;display:flex;gap:6px;align-items:center;justify-content:space-between;font-size:.82rem}
.lb{position:fixed;inset:0;background:rgba(5,10,14,.86);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb img{max-height:100%;max-width:100%;border-radius:6px}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-size:1.2rem}
.note{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.88rem}
.addrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));align-items:end;padding:12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2)}
.approve{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;color:var(--ink)}
.ok-badge{color:var(--ok);font-size:.8rem;font-weight:600}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px)}
.vatbox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.vatrows{display:flex;flex-wrap:wrap;gap:8px 28px}
.vatrows div{display:flex;flex-direction:column}.vatrows span{font-size:.78rem;color:var(--muted)}.vatrows b{font-family:var(--f-head);font-weight:600;font-size:1.05rem}
.vatrows .tot b{color:var(--accent)}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8rem;margin-inline-end:6px}
details.cut{border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
details.cut>summary,details.recipe>summary{cursor:pointer;padding:10px 12px;list-style-position:inside}
details.cut[open]>summary{border-bottom:1px solid var(--line)}
details.cut .tablebox{border:0;border-radius:0 0 8px 8px}
details.recipe>summary{padding:0}
.cutpc{display:inline-flex;gap:4px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 8px;margin:2px}
input.badf{border-color:var(--bad);background:var(--bad-soft)}
td input,td select{padding:5px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
@media (prefers-reduced-motion:no-preference){.card,.stat{transition:border-color .15s}}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";
const STATUSES=["عرض سعر","تم التعميد","تحت التصنيع","جاهز للتركيب","قيد التركيب","مكتمل","ملغي"];
const STATUS_CLS={"تم التعميد":"s1","تحت التصنيع":"s2","جاهز للتركيب":"s2","قيد التركيب":"s2","مكتمل":"s3","ملغي":"bad"};
const BUY_CATS=["ألمنيوم","زجاج","إكسسوارات","مواد تركيب","عمالة","نقل","أخرى"];
const PAY_METHODS=["تحويل بنكي","نقدي","شيك","شبكة"];
const ALU_SYSTEMS=["سرايا","رويال","كرتن وول","سكوريت","أخرى"];
const ITEM_TYPES=["شباك سحاب","شباك مفصلي","شباك ثابت","باب سحاب","باب مفصلي","واجهة","أخرى"];
const TABS=[["info","البيانات"],["docs","العقد والعرض والمخططات"],["colors","اعتماد الألوان"],["pay","الدفعات"],["inst","التركيب"],["meas","المقاسات"],["calc","حساب الكميات"],["photos","الصور"],["buy","المشتريات والأرباح"]];
const MAX_BYTES=20*1024*1024;
const VAT_RATE=0.15;
const VAT_MODES=["قبل الضريبة","شامل الضريبة"];

const S={clients:[],loaded:false,slow:false,err:null,id:null,tab:"info",q:"",status:"",canWrite:true,assets:null,draft:{},confirm:null,lightbox:null,busy:{}};
let db=null;
const app=document.getElementById("app");

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=v=>{const n=parseFloat(String(v??"").replace(/,/g,""));return isFinite(n)?n:0};
const money=n=>N(n).toLocaleString("en-US",{maximumFractionDigits:2});
const M=n=>`<span class="num">${money(n)}</span><span class="cur">ر.س</span>`;
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const sum=(a,f)=>(a||[]).reduce((t,x)=>t+N(f(x)),0);
const area=(w,h,q)=>N(w)*N(h)*(N(q)||1)/1e6;
const AR_MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const AR_DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function dayInfo(iso){const d=new Date(iso+"T00:00:00");if(isNaN(d))return null;return{d:d.getDate(),m:AR_MONTHS[d.getMonth()],w:AR_DAYS[d.getDay()]}}
const blob=id=>"/_blob/"+encodeURIComponent(id);
const extOf=n=>{const m=/\.([a-z0-9]{1,5})$/i.exec(n||"");return m?m[1].toUpperCase():"ملف"};
const isImg=f=>/^image\//.test(f.type||"")||/\.(png|jpe?g|webp|gif|heic)$/i.test(f.name||"");

function calc(c){
  const contract=N(c.contractValue);
  const paid=sum(c.payments,p=>p.amount);
  const cost=sum(c.purchases,p=>p.amount);
  const upcoming=(c.installs||[]).filter(i=>i.status!=="تم"&&i.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0]||null;
  return{contract,paid,remaining:contract-paid,cost,profit:contract-cost,margin:contract?((contract-cost)/contract*100):0,pct:contract?Math.min(100,paid/contract*100):0,upcoming};
}
const cur=()=>S.clients.find(c=>c._id===S.id)||null;
const r2=n=>Math.round(n*100)/100;
function quoteOf(fk,c){
  const amount=N(val(fk,"quoteValue",c.quoteValue));const mode=val(fk,"quoteVatMode",c.quoteVatMode||VAT_MODES[0]);
  let net,total;
  if(mode==="شامل الضريبة"){total=r2(amount);net=r2(amount/(1+VAT_RATE))}else{net=r2(amount);total=r2(amount*(1+VAT_RATE))}
  return{amount,mode,net,vat:r2(total-net),total};
}
function quoteCalcHtml(fk,c){const q=quoteOf(fk,c);return `<div><span>قبل الضريبة</span><b>${M(q.net)}</b></div><div><span>ضريبة القيمة المضافة <span class="num">15%</span></span><b>${M(q.vat)}</b></div><div class="tot"><span>الإجمالي شامل الضريبة</span><b>${M(q.total)}</b></div>`}

/* drafts: form inputs keep their text across live re-renders */
function val(fk,f,def){const d=S.draft[fk];return d&&f in d?d[f]:(def??"")}
function F(fk,f){return `id="f-${(fk+"-"+f).replace(/[^a-zA-Z0-9_-]/g,"_")}" data-f="${esc(fk)}|${esc(f)}"`}
const inp=(fk,f,label,def,type="text",extra="")=>`<label class="fld">${label}<input ${F(fk,f)} type="${type}" value="${esc(val(fk,f,def))}" ${extra} ${S.canWrite?"":"disabled"}></label>`;
const sel=(fk,f,label,opts,def)=>{const v=val(fk,f,def);return `<label class="fld">${label}<select ${F(fk,f)} ${S.canWrite?"":"disabled"}>${opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`};
const area_=(fk,f,label,def)=>`<label class="fld">${label}<textarea ${F(fk,f)} ${S.canWrite?"":"disabled"}>${esc(val(fk,f,def))}</textarea></label>`;
const chk=(fk,f,label,def)=>`<label class="approve"><input type="checkbox" ${F(fk,f)} ${val(fk,f,def)?"checked":""} ${S.canWrite?"":"disabled"}>${label}</label>`;
function del(key,label="حذف"){if(!S.canWrite)return"";const armed=S.confirm===key;return `<button class="danger ghost ${armed?"armed":""}" data-act="del" data-key="${esc(key)}">${armed?"تأكيد الحذف":label}</button>`}

let toastT;function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200)}

/* ---------- writes: one at a time per client ---------- */
const queues={};
function write(id,patch){
  if(!db||!S.canWrite){toast("لا تملك صلاحية التعديل على هذا الملف");return Promise.resolve(false)}
  const run=()=>db.collection("clients").doc(id).update({...patch,updatedAt:new Date().toISOString()}).then(()=>true);
  queues[id]=(queues[id]||Promise.resolve()).then(run).catch(e=>{
    if(e&&e.code==="unavailable")return new Promise(r=>setTimeout(r,600+Math.random()*600)).then(run);
    throw e;
  }).catch(e=>{handleWriteErr(e);return false});
  return queues[id];
}
function handleWriteErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument"&&!S.everWrote){S.canWrite=false;render();toast("صلاحيتك للعرض فقط");return}
  toast(c==="quota_exceeded"?"امتلأت مساحة التخزين، احذف ملفات قديمة":"تعذّر الحفظ، حاول مرة أخرى");
}
function mutateList(field,fn){const c=cur();if(!c)return;const list=[...(c[field]||[])];const next=fn(list)||list;return write(c._id,{[field]:next})}
function mutateFiles(cat,fn){const c=cur();if(!c)return;const files={...(c.files||{})};files[cat]=fn([...(files[cat]||[])])||[];return write(c._id,{files})}

/* ---------- views ---------- */
function topbar(){
  const c=cur();
  return `<header class="top"><div class="wrap">
    <div class="brand"><div class="mark" aria-hidden="true"></div><h1>برج القمة للأعمال المعدنية<small>سجل ملفات العملاء والمشاريع</small></h1></div>
    ${c||S.settings?`<button data-act="back">${S.settings&&c?"→ رجوع للملف":"→ كل الملفات"}</button>`:""}
    ${db&&!S.settings?`<button data-act="open-settings">قوالب الحساب</button>`:""}
    ${S.canWrite&&db&&!c&&!S.settings?`<button class="primary" data-act="new">+ عميل جديد</button>`:""}
  </div></header>`;
}

function listView(){
  if(!db&&S.err==="nodb")return `<div class="card empty"><h2>تعذّر الاتصال بقاعدة البيانات</h2><p class="muted">افتح البرنامج من حسابك في Claude لتظهر ملفات العملاء.</p></div>`;
  if(S.err)return `<div class="card empty"><h2>تعذّر تحميل الملفات</h2><p class="muted">أعد فتح الصفحة بعد قليل.</p></div>`;
  const all=S.clients;
  const active=all.filter(c=>c.status!=="ملغي");
  const tot=active.reduce((t,c)=>{const k=calc(c);t.contract+=k.contract;t.paid+=k.paid;t.rem+=k.remaining;t.profit+=k.profit;t.cost+=k.cost;return t},{contract:0,paid:0,rem:0,profit:0,cost:0});
  const q=S.q.trim();
  const rows=all.filter(c=>(!S.status||c.status===S.status)&&(!q||[c.name,c.fileNo,c.phone,c.location].some(v=>String(v||"").includes(q))))
    .sort((a,b)=>String(b.approvalDate||b.createdAt||"").localeCompare(String(a.approvalDate||a.createdAt||"")));
  const installs=[];all.forEach(c=>(c.installs||[]).forEach(i=>{if(i.status!=="تم"&&i.date&&i.date>=today())installs.push({...i,c})}));

/* safe formula evaluator: numbers, W, H, + - * / ( ) */
function ev(expr,W,H){
  const s=String(expr??"").replace(/\s+/g,"").replace(/[×xX]/g,"*").replace(/÷/g,"/").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));let i=0;
  if(!s)return NaN;
  function atom(){
    const ch=s[i];
    if(ch==="("){i++;const v=add();if(s[i]!==")")throw 0;i++;return v}
    if(ch==="-"){i++;return -atom()} if(ch==="+"){i++;return atom()}
    if(ch==="W"||ch==="w"){i++;return W} if(ch==="H"||ch==="h"){i++;return H}
    const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);
  }
  function mul(){let v=atom();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=atom();v=o==="*"?v*r:v/r}return v}
  function add(){let v=mul();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=mul();v=o==="+"?v+r:v-r}return v}
  try{const v=add();return i===s.length&&isFinite(v)?v:NaN}catch(e){return NaN}
}

/* first-fit decreasing into bars */
function pack(list,cfg){
  const usable=N(cfg.barLen)-N(cfg.trim),kerf=N(cfg.kerf);
  const sorted=[...list].sort((a,b)=>b.len-a.len);const bars=[],over=[];
  for(const pc of sorted){
    if(pc.len>usable){over.push(pc);continue}
    let b=bars.find(b=>b.rem>=pc.len);
    if(!b){b={pieces:[],rem:usable};bars.push(b)}
    b.pieces.push(pc);b.rem=Math.max(0,b.rem-pc.len-kerf);
  }
  bars.forEach(b=>{b.used=sum(b.pieces,p=>p.len);b.off=N(cfg.barLen)-b.used});
  return{bars,over};
}

function takeoff(c,cfg){
  const kgOf={};(cfg.profiles||[]).forEach(p=>kgOf[p.name]=N(p.kg));
  const g=c.colors?.glass||{};const gSpec=[g.type,g.thickness,g.color].filter(Boolean).join(" ")||"زجاج";
  const pieces={},acc={},glass=[],warn=[],perUnit=[];let units=0;
  for(const row of c.alu||[]){
    const r=recipeById(row.recipe);const q=N(row.qty)||1;
    if(!r){warn.push(`«${row.ref}» بدون قالب حساب، اختر له نوعاً من تبويب المقاسات.`);continue}
    const W=N(row.w),H=N(row.h);units+=q;const det={ref:row.ref,recipe:r.name,q,W,H,pcs:[]};
    for(const pc of r.pieces||[]){
      const len=Math.round(ev(pc.f,W,H)),n=Math.round(N(pc.n))*q;
      if(!(len>0)){warn.push(`معادلة «${pc.f}» في ${r.name} أعطت قيمة غير صحيحة للمرجع ${row.ref}.`);continue}
      (pieces[pc.p]=pieces[pc.p]||[]);for(let k=0;k<n;k++)pieces[pc.p].push({len,ref:row.ref});
      det.pcs.push({p:pc.p,len,n});
    }
    for(const gl of r.glass||[]){
      const w=Math.round(ev(gl.w,W,H)),h=Math.round(ev(gl.h,W,H)),n=Math.round(N(gl.n))*q;
      if(!(w>0&&h>0)){warn.push(`مقاس زجاج غير صحيح في ${r.name} للمرجع ${row.ref}.`);continue}
      glass.push({ref:row.ref,spec:gSpec,w,h,qty:n,src:"auto"});
    }
    for(const a of r.acc||[]){
      const v=ev(a.q,W,H);if(!isFinite(v)){warn.push(`كمية «${a.name}» غير صحيحة في ${r.name}.`);continue}
      const k=a.name+"|"+a.unit;(acc[k]=acc[k]||{name:a.name,unit:a.unit,price:N(a.price),qty:0}).qty+=v*q;
    }
    perUnit.push(det);
  }
  for(const r of c.glass||[])glass.push({ref:r.ref,spec:[r.type,r.thick,r.color].filter(Boolean).join(" "),w:N(r.w),h:N(r.h),qty:N(r.qty)||1,src:"manual"});
  const profiles=Object.entries(pieces).map(([name,list])=>{
    const {bars,over}=pack(list,cfg);const net=sum(list,p=>p.len);const nb=bars.length+over.length;
    const kgm=kgOf[name]||0;const kg=nb*N(cfg.barLen)/1000*kgm;
    return{name,pieces:list.length,net,bars,over,nb,waste:nb?1-net/(nb*N(cfg.barLen)):0,kgm,kg,cost:kg*N(cfg.aluPrice)};
  }).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  const accList=Object.values(acc).map(a=>({...a,qty:a.unit==="حبة"||a.unit==="طقم"?Math.ceil(a.qty-1e-9):Math.round(a.qty*100)/100})).map(a=>({...a,total:a.qty*a.price}));
  glass.forEach(x=>x.m2=x.w*x.h*x.qty/1e6);
  const kg=sum(profiles,p=>p.kg),bars=sum(profiles,p=>p.nb),m2=sum(glass,x=>x.m2);
  const cost={alu:sum(profiles,p=>p.cost),paint:kg*N(cfg.paintRate),acc:sum(accList,a=>a.total),glass:m2*N(cfg.glassPrice)};
  cost.total=cost.alu+cost.paint+cost.acc+cost.glass;
  return{profiles,acc:accList,glass,warn,perUnit,units,kg,bars,m2,cost};
}

function groupBar(b){
  const m=new Map();b.pieces.forEach(p=>{const e=m.get(p.len)||{len:p.len,n:0,refs:new Set()};e.n++;e.refs.add(p.ref);m.set(p.len,e)});
  return [...m.values()];
}

function need(fk,fields){const d=S.draft[fk]||{};for(const[f,l]of fields){if(!String(d[f]??"").trim()){toast("أدخل "+l);const el=document.getElementById(("f-"+fk+"-"+f).replace(/[^a-zA-Z0-9_-]/g,"_"));el&&el.focus();return null}}return d}
function rowFrom(fk,defaults){return{...defaults,...(S.draft[fk]||{})}}

async function act(el){
  const a=el.dataset.act;const c=cur();
  if(a==="open"){go(el.dataset.id,el.dataset.tab||"info");return}
  if(a==="back"){if(S.settings){S.settings=false;S.confirm=null;render();window.scrollTo(0,0);return}location.hash="";S.id=null;render();window.scrollTo(0,0);return}
  if(a==="open-settings"){S.cfgDraft=clone(S.cfg);S.settings=true;S.confirm=null;render();window.scrollTo(0,0);return}
  if(a==="save-settings"){
    if(!db||!S.canWrite)return;
    const d=S.cfgDraft;d.recipes.forEach(r=>{r.pieces.forEach(x=>x.n=N(x.n));r.glass.forEach(x=>x.n=N(x.n));r.acc.forEach(x=>x.price=N(x.price))});d.profiles.forEach(x=>x.kg=N(x.kg));["barLen","trim","kerf","aluPrice","paintRate","glassPrice"].forEach(k=>d[k]=N(d[k]));
    if(d.barLen<=0){toast("طول العود يجب أن يكون أكبر من صفر");return}
    try{await db.doc("settings/takeoff").set({...d,updatedAt:new Date().toISOString()});S.everWrote=true;toast("حُفظت قوالب الحساب")}catch(e){handleWriteErr(e)}
    return;
  }
  if(a==="reset-settings"){if(S.confirm!=="reset-cfg"){S.confirm="reset-cfg";render();return}S.confirm=null;S.cfgDraft=clone(DEFAULT_CFG);render();toast("استُرجعت القيم الافتراضية، اضغط «حفظ الإعدادات» لاعتمادها");return}
  if(a==="cfg-add"){const path=el.dataset.path;const list=getPath(S.cfgDraft,path);const key=path.split(".").pop();list.push(BLANK[key]());if(key==="recipes")S.openRecipe=list.length-1;render();return}
  if(a==="cfg-dup"){const ri=+el.dataset.path.split(".")[1];const r=clone(S.cfgDraft.recipes[ri]);r.id="r"+uid();r.name+=" (نسخة)";S.cfgDraft.recipes.splice(ri+1,0,r);S.openRecipe=ri+1;render();return}
  if(a==="cfg-del"){const key="cfg:"+el.dataset.path;if(S.confirm!==key){S.confirm=key;el.textContent="تأكيد الحذف";el.classList.add("armed");clearTimeout(act._t);act._t=setTimeout(()=>{S.confirm=null;render()},4000);return}
    S.confirm=null;const ks=el.dataset.path.split(".");const idx=+ks.pop();getPath(S.cfgDraft,ks.join(".")).splice(idx,1);render();return}
  if(a==="tab"){S.tab=el.dataset.tab;S.confirm=null;render();return}
  if(a==="zoom"){S.lightbox=el.dataset.id;render();return}
  if(a==="unzoom"){S.lightbox=null;render();return}
  if(a==="new"){
    if(!db)return;
    const y=new Date().getFullYear();const nums=S.clients.map(x=>{const m=/(\d+)$/.exec(x.fileNo||"");return m?+m[1]:0});
    const next=`${y}-${String((Math.max(0,...nums)||0)+1).padStart(3,"0")}`;
    const ref=db.collection("clients").doc();
    try{await ref.set({name:"عميل جديد",fileNo:next,approvalDate:today(),status:"تم التعميد",contractValue:0,files:{},payments:[],installs:[],glass:[],alu:[],purchases:[],colors:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});S.everWrote=true}
    catch(e){handleWriteErr(e);return}
    go(ref.id,"info");toast("أُنشئ ملف رقم "+next+"، أكمل بيانات العميل");
    setTimeout(()=>{const n=document.getElementById(("f-info:"+ref.id+"-name").replace(/[^a-zA-Z0-9_-]/g,"_"));n&&(n.focus(),n.select&&n.select())},60);
    return;
  }
  if(!c)return;
  if(a==="export-calc"){exportCalc(c);return}
  if(a==="save-info"){
    const fk="info:"+c._id;const d=S.draft[fk]||{};
    if("name"in d&&!String(d.name).trim()){toast("اسم العميل مطلوب");return}
    const patch={...d};["contractValue","quoteValue"].forEach(f=>{if(f in patch)patch[f]=N(patch[f])});
    if("quoteValue"in patch||"quoteVatMode"in patch){const q=quoteOf(fk,c);patch.quoteNet=q.net;patch.quoteVat=q.vat;patch.quoteTotal=q.total;patch.quoteVatMode=q.mode}
    if(!Object.keys(patch).length){toast("لا توجد تغييرات");return}
    if(await write(c._id,patch)){delete S.draft[fk];S.everWrote=true;render();toast("حُفظت البيانات")}
    return;
  }
  if(a==="quote-to-contract"){
    const fk="info:"+c._id;const q=quoteOf(fk,c);
    if(!q.total){toast("أدخل قيمة عرض السعر أولاً");return}
    const patch={contractValue:q.total,quoteValue:q.amount,quoteVatMode:q.mode,quoteNet:q.net,quoteVat:q.vat,quoteTotal:q.total};
    if(await write(c._id,patch)){const d=S.draft[fk];if(d){delete d.contractValue;delete d.quoteValue;delete d.quoteVatMode}render();toast("قيمة العقد الآن "+money(q.total)+" ر.س شامل الضريبة")}
    return;
  }
  if(a==="save-colors"){
    const fk="colors:"+c._id;const d=S.draft[fk]||{};const colors=JSON.parse(JSON.stringify(c.colors||{}));
    for(const[key,v]of Object.entries(d)){const parts=key.split(".");if(parts.length===2){colors[parts[0]]=colors[parts[0]]||{};colors[parts[0]][parts[1]]=v;if(parts[1]==="approved"&&v&&!colors[parts[0]].date)colors[parts[0]].date=today()}else colors[key]=v}
    if(await write(c._id,{colors})){delete S.draft[fk];render();toast("حُفظ اعتماد الألوان")}
    return;
  }
  if(a==="save-mfin"){
    const fk="mfin:"+c._id;const d=S.draft[fk]||{};const final="final"in d?!!d.final:!!c.measFinal;
    const date=d.date??c.measFinalDate??"";
    if(await write(c._id,{measFinal:final,measFinalDate:final&&!date?today():date})){delete S.draft[fk];render();toast("حُفظ")}
    return;
  }
  if(a==="add-pay"){
    const fk="pay:"+c._id;const d=need(fk,[["amount","المبلغ"]]);if(!d)return;
    if(N(d.amount)<=0){toast("المبلغ يجب أن يكون أكبر من صفر");return}
    const r=rowFrom(fk,{date:today(),method:"تحويل بنكي",note:""});
    if(await mutateList("payments",l=>{l.push({id:uid(),date:r.date,amount:N(r.amount),method:r.method,note:r.note})})){delete S.draft[fk];render();toast("سُجّلت الدفعة")}
    return;
  }
  if(a==="add-inst"){
    const fk="inst:"+c._id;const r=rowFrom(fk,{date:today(),time:"",team:"",note:""});if(!r.date){toast("أدخل التاريخ");return}
    if(await mutateList("installs",l=>{l.push({id:uid(),date:r.date,time:r.time,team:r.team,note:r.note,status:"مجدول"})})){delete S.draft[fk];render();toast("أُضيف موعد التركيب")}
    return;
  }
  if(a==="add-alu"||a==="add-glass"){
    const kind=a==="add-alu"?"alu":"glass";const fk=kind+":"+c._id;
    const d=need(fk,[["ref","المرجع"],["w","العرض"],["h","الارتفاع"]]);if(!d)return;
    const r=kind==="alu"?rowFrom(fk,{recipe:(S.cfg.recipes[0]||{}).id,qty:"1",note:""}):rowFrom(fk,{type:"دبل",thick:"6مم",color:(c.colors?.glass?.color)||"",qty:"1"});
    const row={id:uid(),...r,w:N(r.w),h:N(r.h),qty:N(r.qty)||1};
    if(kind==="alu"){const rc=recipeById(row.recipe);if(!rc){toast("اختر قالب الحساب");return}row.system=rc.system;row.type=rc.name}
    if(await mutateList(kind,l=>{l.push(row)})){const keep={};if(kind==="alu"){keep.recipe=r.recipe}else{keep.type=r.type;keep.thick=r.thick;keep.color=r.color}S.draft[fk]=keep;render();toast("أُضيف "+row.ref);
      const n=document.getElementById(("f-"+fk+"-ref").replace(/[^a-zA-Z0-9_-]/g,"_"));n&&n.focus()}
    return;
  }
  if(a==="add-buy"){
    const fk="buy:"+c._id;const d=need(fk,[["amount","المبلغ"]]);if(!d)return;
    const r=rowFrom(fk,{date:today(),supplier:"",invoiceNo:"",category:"ألمنيوم",note:""});
    if(await mutateList("purchases",l=>{l.push({id:uid(),date:r.date,supplier:r.supplier,invoiceNo:r.invoiceNo,category:r.category,amount:N(r.amount),note:r.note})})){delete S.draft[fk];render();toast("أُضيفت الفاتورة، يمكنك إرفاق صورتها من الجدول")}
    return;
  }
  if(a==="del"){
    const key=el.dataset.key;
    if(S.confirm!==key){S.confirm=key;render();clearTimeout(act._t);act._t=setTimeout(()=>{S.confirm=null;render()},4000);return}
    S.confirm=null;const[type,x,y]=key.split(":");
    if(type==="client"){try{await db.collection("clients").doc(c._id).delete();location.hash="";S.id=null;render();toast("حُذف ملف العميل")}catch(e){handleWriteErr(e)}return}
    if(type==="file"){await mutateFiles(x,l=>l.filter(f=>f.id!==y));return}
    const field={pay:"payments",inst:"installs",alu:"alu",glass:"glass",buy:"purchases"}[type];
    if(field)await mutateList(field,l=>l.filter(r=>r.id!==x));
    return;
  }
}

async function upload(files){
  const out=[];
  for(const f of files){
    if(f.size>MAX_BYTES){toast(`«${f.name}» أكبر من 20 ميجابايت`);continue}
    try{const r=await S.assets.upload(f);out.push({id:r.id,name:f.name,type:r.contentType||f.type,size:r.sizeBytes,at:new Date().toISOString()})}
    catch(e){toast(e&&e.code==="unsupported_type"?`نوع الملف «${f.name}» غير مدعوم`:e&&e.code==="quota_exceeded"?"امتلأت مساحة الملفات":`تعذّر رفع «${f.name}»`)}
  }
  return out;
}

function go(id,tab){S.id=id;S.tab=tab||"info";S.confirm=null;try{history.replaceState(null,"","#c-"+id)}catch(e){location.hash="c-"+id}render();window.scrollTo(0,0)}
function fromHash(){const m=/^#c-([A-Za-z0-9_.~:@+-]+)$/.exec(location.hash);S.id=m?m[1]:null;if(!m)S.tab="info";render()}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.tagName==="SELECT")return;if(el.tagName==="INPUT")return;e.preventDefault&&el.tagName!=="A"&&e.preventDefault();act(el)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.lightbox){S.lightbox=null;render();return}
  if(e.key==="Enter"){const el=e.target.closest("tr[data-act],li[data-act]");if(el){act(el);return}
    const row=e.target.closest(".addrow");if(row&&e.target.tagName==="INPUT"){const b=row.querySelector("button[data-act]");if(b){e.preventDefault();act(b)}}}
});
const onField=e=>{const el=e.target;
  if(el.dataset&&el.dataset.f){const i=el.dataset.f.indexOf("|");const fk=el.dataset.f.slice(0,i),f=el.dataset.f.slice(i+1);(S.draft[fk]=S.draft[fk]||{})[f]=el.type==="checkbox"?el.checked:el.value;
    if(fk.startsWith("info:")&&(f==="quoteValue"||f==="quoteVatMode")){const box=document.getElementById("quote-calc");const c=cur();if(box&&c)box.innerHTML=quoteCalcHtml(fk,c)}
    return}
  if(el.dataset&&el.dataset.s&&S.cfgDraft){setPath(S.cfgDraft,el.dataset.s,el.value);if(e.type==="change")render();return}
  if(el.id==="q"){S.q=el.value;render();return}
  if(el.id==="statusFilter"&&e.type==="change"){S.status=el.value;render();return}
};
document.addEventListener("input",onField);
document.addEventListener("change",async e=>{
  const el=e.target;onField(e);
  if(el.dataset.alurec&&e.type==="change"){const id=el.dataset.alurec,rc=recipeById(el.value);if(!rc)return;await mutateList("alu",l=>l.map(r=>r.id===id?{...r,recipe:rc.id,system:rc.system,type:rc.name}:r));toast("تغيّر قالب الحساب");return}
  if(el.dataset.inst&&e.type==="change"){const id=el.dataset.inst,v=el.value;await mutateList("installs",l=>l.map(r=>r.id===id?{...r,status:v}:r));toast("حُدّثت حالة الموعد");return}
  if(el.dataset.up&&el.files&&el.files.length){
    const cat=el.dataset.up;const files=[...el.files];const cid=S.id;S.busy[cat]=true;render();
    const got=await upload(files);S.busy[cat]=false;
    if(got.length&&cid===S.id){if(await mutateFiles(cat,l=>l.concat(got)))toast(got.length===1?"رُفع الملف":"رُفعت "+got.length+" ملفات")}
    render();return;
  }
  if(el.dataset.inv&&el.files&&el.files[0]){
    const pid=el.dataset.inv;S.busy["inv:"+pid]=true;render();
    const got=await upload([el.files[0]]);S.busy["inv:"+pid]=false;
    if(got[0])await mutateList("purchases",l=>l.map(r=>r.id===pid?{...r,fileId:got[0].id,fileName:got[0].name}:r));
    render();return;
  }
});
window.addEventListener("hashchange",fromHash);
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.ri!=null){if(d.open)S.openRecipe=+d.dataset.ri;else if(S.openRecipe===+d.dataset.ri)S.openRecipe=null}},true);

/* ---------- boot ---------- */
fromHash();
(async()=>{
  const use=window.claude&&window.claude.use;
  if(!use){S.err="nodb";render();return}
  db=await window.claude.use("db");
  if(!db){S.err="nodb";render();return}
  S.err=null;
  const t=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
  db.collection("clients").onSnapshot(snap=>{
    S.clients=snap.docs.map(d=>({...d.data(),_id:d.id}));
    if(!snap.metadata.fromCache){S.loaded=true;S.slow=false;clearTimeout(t)}
    render();
  },err=>{clearTimeout(t);S.loaded=true;S.err=err.code||"error";render()});
  db.doc("settings/takeoff").onSnapshot(snap=>{
    if(snap.exists){const d=snap.data();S.cfg={...clone(DEFAULT_CFG),...clone(d)};S.cfgSaved=true}
    render();
  },()=>{});
  render();
  const user=await window.claude.use("user");
  if(user){try{const w=await user.can("data.write");if(w===false){S.canWrite=false;render()}}catch(e){}}
  S.assets=await window.claude.use("assets");render();
  S.downloads=await window.claude.use("downloads");render();
})();
})();
</script>
