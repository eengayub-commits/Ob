<style>

<div id="app"></div>

<script>
(function(){
"use strict";
try{document.documentElement.setAttribute("dir","rtl");document.documentElement.setAttribute("lang","ar-u-nu-latn")}catch(_){}
const STATUSES=["عرض سعر","تم التعميد","تحت التصنيع","جاهز للتركيب","قيد التركيب","مكتمل","ملغي"];
const STATUS_CLS={"تم التعميد":"s1","تحت التصنيع":"s2","جاهز للتركيب":"s2","قيد التركيب":"s2","مكتمل":"s3","ملغي":"bad"};
const BUY_CATS=["ألمنيوم","زجاج","إكسسوارات","مواد تركيب","عمالة","نقل","أخرى"];
const PAY_METHODS=["تحويل بنكي","نقدي","شيك","شبكة"];
const ALU_SYSTEMS=["سرايا","رويال","كرتن وول","سكوريت","أخرى"];
const ITEM_TYPES=["شباك سحاب","شباك مفصلي","شباك ثابت","باب سحاب","باب مفصلي","واجهة","أخرى"];
const TABS=[["info","البيانات"],["pre","المقاسات الأولية"],["docs","عرض السعر والمخططات"],["contract","العقد والاعتمادات"],["meas","المقاسات النهائية"],["calc","حساب الكميات"],["aorder","طلب الألمنيوم والدهان"],["cut","Cutting List"],["acc","الإكسسوارات"],["glassm","مقاسات وطلب الزجاج"],["shop","المخططات Shop Drawings"],["pay","الدفعات"],["inst","مواعيد التركيب"],["buy","المشتريات والأرباح"],["photos","الصور والفيديو"],["handover","محضر التسليم"],["invoices","فواتير المبيعات وكشوفات الحساب"]];
const MAX_BYTES=20*1024*1024;
const VAT_RATE=0.15;
const VAT_MODES=["قبل الضريبة","شامل الضريبة"];

const S={clients:[],loaded:false,slow:false,err:null,id:null,tab:"info",q:"",status:"",canWrite:true,assets:null,draft:{},confirm:null,lightbox:null,busy:{}};
let db=null;
const app=document.getElementById("app");

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-0x660).replace(/[\u06F0-\u06F9]/g,d=>d.charCodeAt(0)-0x6F0).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toLat=v=>String(v??"").replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-0x660).replace(/[\u06F0-\u06F9]/g,d=>d.charCodeAt(0)-0x6F0).replace(/\u066B/g,".").replace(/\u066C/g,",");
const N=v=>{const n=parseFloat(toLat(v).replace(/,/g,""));return isFinite(n)?n:0};
const money=n=>N(n).toLocaleString("en-US",{maximumFractionDigits:2});
const M=n=>`<span class="num">${money(n)}</span><span class="cur">ر.س</span>`;
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const sum=(a,f)=>(a||[]).reduce((t,x)=>t+N(f(x)),0);
const area=(w,h,q)=>N(w)*N(h)*(N(q)||1)/1e6;
const AR_MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const AR_DAYS=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function dayInfo(iso){const d=new Date(iso+"T00:00:00");if(isNaN(d))return null;return{d:d.getDate(),m:AR_MONTHS[d.getMonth()],w:AR_DAYS[d.getDay()]}}
const blob=id=>"/_blob/"+encodeURIComponent(id);
const extOf=n=>{const m=/\.([a-z0-9]{1,5})$/i.exec(n||"");return m?m[1].toUpperCase():"ملف"};
const isImg=f=>/^image\//.test(f.type||"")||/\.(png|jpe?g|webp|gif|heic)$/i.test(f.name||"");

function calc(c){
  const contract=N(c.contractValue);
  const paid=sum(c.payments,p=>p.amount);
  const cost=sum(c.purchases,p=>p.amount);
  const upcoming=(c.installs||[]).filter(i=>i.status!=="تم"&&i.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0]||null;
  return{contract,paid,remaining:contract-paid,cost,profit:contract-cost,margin:contract?((contract-cost)/contract*100):0,pct:contract?Math.min(100,paid/contract*100):0,upcoming};
}
const cur=()=>S.clients.find(c=>c._id===S.id)||null;
const r2=n=>Math.round(n*100)/100;
function quoteOf(fk,c){
  const amount=N(val(fk,"quoteValue",c.quoteValue));const mode=val(fk,"quoteVatMode",c.quoteVatMode||VAT_MODES[0]);
  let net,total;
  if(mode==="شامل الضريبة"){total=r2(amount);net=r2(amount/(1+VAT_RATE))}else{net=r2(amount);total=r2(amount*(1+VAT_RATE))}
  return{amount,mode,net,vat:r2(total-net),total};
}
function quoteCalcHtml(fk,c){const q=quoteOf(fk,c);return `<div><span>قبل الضريبة</span><b>${M(q.net)}</b></div><div><span>ضريبة القيمة المضافة <span class="num">15%</span></span><b>${M(q.vat)}</b></div><div class="tot"><span>الإجمالي شامل الضريبة</span><b>${M(q.total)}</b></div>`}

/* drafts: form inputs keep their text across live re-renders */
function val(fk,f,def){const d=S.draft[fk];return d&&f in d?d[f]:(def??"")}
function F(fk,f){return `id="f-${(fk+"-"+f).replace(/[^a-zA-Z0-9_-]/g,"_")}" data-f="${esc(fk)}|${esc(f)}"`}
const inp=(fk,f,label,def,type="text",extra="")=>`<label class="fld">${label}<input ${F(fk,f)} type="${type}" value="${esc(val(fk,f,def))}" ${extra} ${S.canWrite?"":"disabled"}></label>`;
const sel=(fk,f,label,opts,def)=>{const v=val(fk,f,def);return `<label class="fld">${label}<select ${F(fk,f)} ${S.canWrite?"":"disabled"}>${opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`};
const area_=(fk,f,label,def)=>`<label class="fld">${label}<textarea ${F(fk,f)} ${S.canWrite?"":"disabled"}>${esc(val(fk,f,def))}</textarea></label>`;
const chk=(fk,f,label,def)=>`<label class="approve"><input type="checkbox" ${F(fk,f)} ${val(fk,f,def)?"checked":""} ${S.canWrite?"":"disabled"}>${label}</label>`;
function del(key,label="حذف"){if(!S.canWrite)return"";const armed=S.confirm===key;return `<button class="danger ghost ${armed?"armed":""}" data-act="del" data-key="${esc(key)}">${armed?"تأكيد الحذف":label}</button>`}

const TOAST_T={ok:"تم بنجاح",info:"للعلم",warn:"تنبيه",bad:"تعذّر إكمال العملية"},TOAST_I={ok:"✓",info:"i",warn:"!",bad:"×"};
function toastKind(m){m=String(m);if(/^(تعذّر|تعذر|امتلأت|لا تملك|صلاحيتك|نوع الملف)|غير مدعوم|أكبر من 20/.test(m))return"bad";if(/^(أدخل|اختر|ارفع|اكتب|أكمل|لا توجد|لا يوجد|المبلغ يجب|طول العود|اسم العميل مطلوب|افتح)|متاح(ة)? فقط|غير متاح/.test(m))return"warn";if(/^(جارٍ|استُلم)/.test(m))return"info";return"ok"}
function toast(msg,o={}){let box=document.querySelector(".toasts");if(!box){box=document.createElement("div");box.className="toasts";box.setAttribute("role","status");box.setAttribute("aria-live","polite");document.body.appendChild(box)}
  const k=o.kind||toastKind(msg);const dur=o.duration||(k==="bad"||k==="warn"?6000:o.action?6000:4000);
  const t=document.createElement("div");t.className="toast "+k;t.style.setProperty("--dur",dur+"ms");
  t.innerHTML=`<span class="ti" aria-hidden="true">${TOAST_I[k]}</span><div class="tb"><div class="tt">${esc(o.title||TOAST_T[k])}</div><div class="tm">${esc(msg)}</div></div>${o.action?`<button class="ta">${esc(o.action.label)}</button>`:""}<button class="tx" aria-label="إغلاق">×</button><i class="tp" aria-hidden="true"></i>`;
  const close=()=>{clearTimeout(t._h);t.remove()};t.querySelector(".tx").onclick=close;if(o.action)t.querySelector(".ta").onclick=()=>{close();o.action.fn()};
  t.onmouseenter=()=>clearTimeout(t._h);t.onmouseleave=()=>{t._h=setTimeout(close,2000)};
  box.appendChild(t);while(box.children.length>3)box.firstChild.remove();t._h=setTimeout(close,dur)}

/* ---------- writes: one at a time per client ---------- */
const queues={};
function write(id,patch){
  if(!db||!S.canWrite){toast("لا تملك صلاحية التعديل على هذا الملف");return Promise.resolve(false)}
  const run=()=>db.collection("clients").doc(id).update({...patch,updatedAt:new Date().toISOString()}).then(()=>true);
  queues[id]=(queues[id]||Promise.resolve()).then(run).catch(e=>{
    if(e&&e.code==="unavailable")return new Promise(r=>setTimeout(r,600+Math.random()*600)).then(run);
    throw e;
  }).catch(e=>{handleWriteErr(e);return false});
  return queues[id];
}
function handleWriteErr(e){
  const c=e&&e.code;
  if(c==="invalid_argument"&&!S.everWrote){S.canWrite=false;render();toast("صلاحيتك للعرض فقط");return}
  toast(c==="quota_exceeded"?"امتلأت مساحة التخزين. احذف ملفات غير مستخدمة ثم أعد المحاولة":"تعذّر الحفظ، حاول مرة أخرى");
}
const phoneKey=v=>toLat(v).replace(/\D/g,"").replace(/^(966|0)/,"");
function projectsOf(c){if(!c||!c.clientKey)return c?[c]:[];return S.clients.filter(x=>x.clientKey===c.clientKey).sort((a,b)=>String(a.fileNo||"").localeCompare(String(b.fileNo||"")))}
const projLabel=c=>c.project||"المشروع الأساسي";
function findSameClient(name,phone,exceptId){const pk=phoneKey(phone);const nm=String(name||"").trim();return S.clients.find(x=>x._id!==exceptId&&((pk.length>=8&&phoneKey(x.phone)===pk)||(nm&&nm!=="عميل جديد"&&String(x.name||"").trim()===nm)))}
function projectsBar(c){
  const ps=projectsOf(c);const multi=ps.length>1;
  if(!multi&&!S.canWrite)return"";
  let tot="";if(multi){const t=ps.reduce((a,x)=>{const k=calc(x);a.c+=k.contract;a.p+=k.paid;a.r+=k.remaining;return a},{c:0,p:0,r:0});
    tot=`<span class="pb-tot">إجمالي العميل: العقود ${M(t.c)} · المدفوع <span class="pos">${M(t.p)}</span> · المتبقي <span class="${t.r>0?"neg":"pos"}">${M(t.r)}</span></span>`}
  const others=S.clients.filter(x=>!ps.includes(x));const sug=others.filter(x=>findSameClient(c.name,c.phone,c._id)===x||(phoneKey(c.phone).length>=8&&phoneKey(x.phone)===phoneKey(c.phone)));
  return `<section class="projbar"><span class="pb-l">${multi?`مشاريع العميل <span class="cnt num">${ps.length}</span>`:"المشروع"}</span>
    <div class="pb-tabs">${ps.map(x=>`<button class="pb-tab ${x._id===c._id?"on":""}" data-act="open" data-id="${esc(x._id)}" data-tab="${esc(S.tab)}"><b>${esc(projLabel(x))}</b><span class="num">${esc(x.fileNo||"")}</span></button>`).join("")}
    ${S.canWrite?`<button class="ghost" data-act="new-proj">+ مشروع جديد لنفس العميل</button>`:""}</div>
    ${tot}
    ${S.canWrite&&!multi&&sug.length?`<span class="small muted">يوجد ملف بنفس الاسم أو الجوال: ${sug.slice(0,3).map(x=>`<button class="linkbtn" data-act="link-proj" data-id="${esc(x._id)}">ربطه بـ ${esc(x.fileNo||"")} (${esc(projLabel(x))})</button>`).join(" ")}</span>`:""}
    ${S.canWrite&&multi?`<button class="ghost danger" data-act="unlink-proj" style="font-size:.8rem">فصل هذا المشروع</button>`:""}
  </section>`;
}
function mutateList(field,fn){const c=cur();if(!c)return;const list=[...(c[field]||[])];const next=fn(list)||list;return write(c._id,{[field]:next})}
function mutateFiles(cat,fn){const c=cur();if(!c)return;const files={...(c.files||{})};files[cat]=fn([...(files[cat]||[])])||[];return write(c._id,{files})}

/* ---------- views ---------- */
function topbar(){
  const c=cur();
  return `<header class="top"><div class="wrap">
    <div class="brand">${CO().logo?`<img class="logo" src="${blob(CO().logo)}" alt="">`:`<div class="mark" aria-hidden="true"></div>`}<h1>${esc(CO().nameAr)}<small>سجل ملفات العملاء والمشاريع</small></h1></div>
    ${c||S.settings||S.qid?`<button data-act="back">${S.settings&&c?"→ رجوع للملف":S.settings&&S.qid?"→ رجوع للعرض":S.qid&&!S.settings?"→ عروض الأسعار":"→ كل الملفات"}</button>`:""}
    ${db&&!S.settings?`<button data-act="open-settings">الإعدادات</button>`:""}
    ${S.canWrite&&db&&!c&&!S.settings&&!S.qid?(S.section==="quotes"?`<button class="primary" data-act="q-new">+ عرض سعر جديد</button>`:`<button class="primary" data-act="new">+ عميل جديد</button>`):""}
  </div></header>`;
}

function listView(){
  if(!db&&S.err==="nodb")return `<div class="card empty"><h2>تعذّر الاتصال بقاعدة البيانات</h2><p class="muted">افتح البرنامج من حسابك في Claude لتظهر ملفات العملاء.</p></div>`;
  if(S.err)return `<div class="card empty"><h2>تعذّر تحميل الملفات</h2><p class="muted">أعد فتح الصفحة بعد قليل.</p></div>`;
  const all=S.clients;
  const active=all.filter(c=>c.status!=="ملغي");
  const tot=active.reduce((t,c)=>{const k=calc(c);t.contract+=k.contract;t.paid+=k.paid;t.rem+=k.remaining;t.profit+=k.profit;t.cost+=k.cost;return t},{contract:0,paid:0,rem:0,profit:0,cost:0});
  const q=S.q.trim();
  const rows=all.filter(c=>(!S.status||c.status===S.status)&&(!q||[c.name,c.fileNo,c.phone,c.location,c.project].some(v=>String(v||"").includes(q))))
    .sort((a,b)=>String(b.approvalDate||b.createdAt||"").localeCompare(String(a.approvalDate||a.createdAt||"")));
  const installs=[];all.forEach(c=>(c.installs||[]).forEach(i=>{if(i.status!=="تم"&&i.date&&i.date>=today())installs.push({...i,c})}));
  installs.sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));

  const stats=`<section class="stats" aria-label="ملخص">
    <div class="stat"><span>ملفات نشطة</span><b class="num">${active.length}</b></div>
    <div class="stat"><span>قيمة العقود</span><b>${M(tot.contract)}</b></div>
    <div class="stat"><span>المحصّل</span><b class="pos">${M(tot.paid)}</b></div>
    <div class="stat"><span>المتبقي عند العملاء</span><b class="${tot.rem>0?"neg":""}">${M(tot.rem)}</b></div>
    <div class="stat"><span>صافي الربح (العقود − المشتريات)</span><b class="${tot.profit>=0?"pos":"neg"}">${M(tot.profit)}</b></div>
  </section>`;

  let table;

/* safe formula evaluator: numbers, W, H, + - * / ( ) */
function ev(expr,W,H){
  const s=String(expr??"").replace(/\s+/g,"").replace(/[×xX]/g,"*").replace(/÷/g,"/").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));let i=0;
  if(!s)return NaN;
  function atom(){
    const ch=s[i];
    if(ch==="("){i++;const v=add();if(s[i]!==")")throw 0;i++;return v}
    if(ch==="-"){i++;return -atom()} if(ch==="+"){i++;return atom()}
    if(ch==="W"||ch==="w"){i++;return W} if(ch==="H"||ch==="h"){i++;return H}
    const m=/^\d+(\.\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0]);
  }
  function mul(){let v=atom();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=atom();v=o==="*"?v*r:v/r}return v}
  function add(){let v=mul();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=mul();v=o==="+"?v+r:v-r}return v}
  try{const v=add();return i===s.length&&isFinite(v)?v:NaN}catch(e){return NaN}
}

/* first-fit decreasing into bars */
function pack(list,cfg){
  const usable=N(cfg.barLen)-N(cfg.trim),kerf=N(cfg.kerf);
  const sorted=[...list].sort((a,b)=>b.len-a.len);const bars=[],over=[];
  for(const pc of sorted){
    if(pc.len>usable){over.push(pc);continue}
    let b=bars.find(b=>b.rem>=pc.len);
    if(!b){b={pieces:[],rem:usable};bars.push(b)}
    b.pieces.push(pc);b.rem=Math.max(0,b.rem-pc.len-kerf);
  }
  bars.forEach(b=>{b.used=sum(b.pieces,p=>p.len);b.off=N(cfg.barLen)-b.used});
  return{bars,over};
}

function takeoff(c,cfg){
  const kgOf={};(cfg.profiles||[]).forEach(p=>kgOf[p.name]=N(p.kg));
  const g=c.colors?.glass||{};const gSpec=[g.type,g.thickness,g.color].filter(Boolean).join(" ")||"زجاج";
  const pieces={},acc={},glass=[],warn=[],perUnit=[];let units=0;
  for(const row of c.alu||[]){
    const r=recipeById(row.recipe);const q=N(row.qty)||1;
    if(!r){warn.push(`«${row.ref}» بدون قالب حساب، اختر له نوعاً من تبويب المقاسات.`);continue}
    const W=N(row.w),H=N(row.h);units+=q;const det={ref:row.ref,recipe:r.name,q,W,H,pcs:[],gl:[],floor:row.floor||"",note:row.note||""};
    for(const pc of r.pieces||[]){
      const len=Math.round(ev(pc.f,W,H)),n=Math.round(N(pc.n))*q;
      if(!(len>0)){warn.push(`معادلة «${pc.f}» في ${r.name} أعطت قيمة غير صحيحة للمرجع ${row.ref}.`);continue}
      (pieces[pc.p]=pieces[pc.p]||[]);for(let k=0;k<n;k++)pieces[pc.p].push({len,ref:row.ref});
      det.pcs.push({p:pc.p,len,n,f:pc.f});
    }
    for(const gl of r.glass||[]){
      const w=Math.round(ev(gl.w,W,H)),h=Math.round(ev(gl.h,W,H)),n=Math.round(N(gl.n))*q;
      if(!(w>0&&h>0)){warn.push(`مقاس زجاج غير صحيح في ${r.name} للمرجع ${row.ref}.`);continue}
      glass.push({ref:row.ref,spec:gSpec,w,h,qty:n,src:"auto"});det.gl.push({w,h,n});
    }
    for(const a of r.acc||[]){
      const v=ev(a.q,W,H);if(!isFinite(v)){warn.push(`كمية «${a.name}» غير صحيحة في ${r.name}.`);continue}
      const k=a.name+"|"+a.unit;(acc[k]=acc[k]||{name:a.name,unit:a.unit,price:N(a.price),qty:0,cat:accCat(a)}).qty+=v*q;
    }
    perUnit.push(det);
  }
  for(const r of c.glass||[])glass.push({ref:r.ref,spec:[r.type,r.thick,r.color].filter(Boolean).join(" "),w:N(r.w),h:N(r.h),qty:N(r.qty)||1,src:"manual"});
  const profiles=Object.entries(pieces).map(([name,list])=>{
    const {bars,over}=pack(list,cfg);const net=sum(list,p=>p.len);const nb=bars.length+over.length;
    const kgm=kgOf[name]||0;const kg=nb*N(cfg.barLen)/1000*kgm;
    return{name,pieces:list.length,net,bars,over,nb,waste:nb?1-net/(nb*N(cfg.barLen)):0,kgm,kg,cost:kg*N(cfg.aluPrice)};
  }).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  const accList=Object.values(acc).map(a=>({...a,qty:a.unit==="حبة"||a.unit==="طقم"?Math.ceil(a.qty-1e-9):Math.round(a.qty*100)/100})).map(a=>({...a,total:a.qty*a.price}));
  glass.forEach(x=>x.m2=x.w*x.h*x.qty/1e6);
  const kg=sum(profiles,p=>p.kg),bars=sum(profiles,p=>p.nb),m2=sum(glass,x=>x.m2);
  const aluM=sum(profiles,p=>p.net)/1000,tf=N(cfg.tapeFactor??1),roll=N(cfg.tapeRoll)||100;
  const tape={aluM,factor:tf,m:aluM*tf,roll,rolls:Math.ceil(aluM*tf/roll-1e-9),cost:0};tape.cost=tape.rolls*N(cfg.tapePrice);
  const cc=k=>sum(accList.filter(a=>a.cat===k),a=>a.total);
  const cost={alu:sum(profiles,p=>p.cost),paint:kg*N(cfg.paintRate),acc:cc("acc"),screw:cc("screw"),rubber:cc("rubber"),tape:tape.cost+cc("tape"),glass:m2*N(cfg.glassPrice)};
  cost.total=cost.alu+cost.paint+cost.acc+cost.screw+cost.rubber+cost.tape+cost.glass;
  return{profiles,acc:accList,glass,warn,perUnit,units,kg,bars,m2,cost,tape};
}

function groupBar(b){
  const m=new Map();b.pieces.forEach(p=>{const e=m.get(p.len)||{len:p.len,n:0,refs:new Set()};e.n++;e.refs.add(p.ref);m.set(p.len,e)});
  return [...m.values()];
}

const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLoad=null,viewTok=0;
function addScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(!pdfLoad){pdfLoad=addScript(PDFJS+"pdf.min.js").then(()=>addScript(PDFJS+"pdf.worker.min.js")).then(()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";return window.pdfjsLib});pdfLoad.catch(()=>{pdfLoad=null})}
  return pdfLoad;
}
function fileKind(f){const n=(f.name||"").toLowerCase(),t=f.type||"";if(t.startsWith("image/")||/\.(png|jpe?g|webp|gif|bmp)$/.test(n))return"img";if(t==="application/pdf"||/\.pdf$/.test(n))return"pdf";return"other"}
async function fetchFile(f){const r=await fetch(blob(f.id));if(!r.ok)throw new Error("http "+r.status);return r.blob()}
function closeViewer(){viewTok++;const v=document.getElementById("viewer");if(v)v.remove();document.body.style.overflow=""}
async function openViewer(f){
  closeViewer();const tok=++viewTok;
  const v=document.createElement("div");v.id="viewer";v.className="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-label",f.name);
  v.innerHTML=`<div class="vbar"><b class="vname"></b><span style="flex:1"></span>${S.downloads?`<button data-v="dl">تنزيل</button>`:""}<button data-v="close">إغلاق ✕</button></div><div class="vbody"><p class="vmsg">جارٍ فتح الملف…</p></div>`;
  v.querySelector(".vname").textContent=f.name;document.body.appendChild(v);document.body.style.overflow="hidden";
  const body=v.querySelector(".vbody"),msg=t=>{body.innerHTML="";const p=document.createElement("p");p.className="vmsg";p.textContent=t;body.appendChild(p)};
  let data=null;
  v.addEventListener("click",async e=>{const b=e.target.closest("[data-v]");if(!b)return;
    if(b.dataset.v==="close")closeViewer();
    if(b.dataset.v==="dl"){try{data=data||await fetchFile(f);await S.downloads.save({filename:f.name,data})}catch(err){const c=err&&err.code;if(c==="declined")return;toast(c==="rejected_extension"?"هذا النوع من الملفات لا يمكن تنزيله من البرنامج":"تعذّر تنزيل الملف")}}
  });
  try{data=await fetchFile(f)}catch(e){if(tok===viewTok)msg("تعذّر تحميل الملف. ربما لم يكتمل رفعه، احذفه وارفعه مرة ثانية.");return}
  if(tok!==viewTok)return;
  const kind=fileKind({name:f.name,type:f.type||data.type});
  if(kind==="img"){body.innerHTML="";const img=document.createElement("img");img.src=URL.createObjectURL(data);img.alt=f.name;img.className="vimg";body.appendChild(img);return}
  if(kind==="pdf"){
    try{
      const lib=await loadPdfJs();if(tok!==viewTok)return;
      const doc=await lib.getDocument({data:new Uint8Array(await data.arrayBuffer())}).promise;if(tok!==viewTok)return;
      body.innerHTML="";const dpr=Math.min(2,window.devicePixelRatio||1);
      for(let i=1;i<=doc.numPages;i++){
        const pg=await doc.getPage(i);if(tok!==viewTok)return;
        const base=pg.getViewport({scale:1});const w=Math.min(body.clientWidth-16,1000);const vp=pg.getViewport({scale:w/base.width*dpr});
        const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;cv.style.width=(vp.width/dpr)+"px";body.appendChild(cv);
        await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      }
    }catch(e){if(tok===viewTok)msg(S.downloads?"تعذّر عرض ملف PDF هنا. اضغط «تنزيل» لفتحه على جهازك.":"تعذّر عرض ملف PDF هنا.")}
    return;
  }
  msg(S.downloads?"لا يمكن معاينة هذا النوع داخل البرنامج. اضغط «تنزيل» لفتحه على جهازك.":"لا يمكن معاينة هذا النوع داخل البرنامج.");
}

/* ---------- handwritten sheets → extraction → PDF ---------- */
const GROUPS={regular:"شبابيك",bath_door:"شبابيك حمامات سانديلاست وأبواب",small_green:"مقاسات صغيرة (مظللة بالأخضر)"};
S.ex={};S.sample=null;S.pdfBusy=false;
const JSPDF="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
let jspdfLoad=null;
function loadJsPdf(){if(window.jspdf)return Promise.resolve(window.jspdf);if(!jspdfLoad){jspdfLoad=addScript(JSPDF).then(()=>window.jspdf);jspdfLoad.catch(()=>{jspdfLoad=null})}return jspdfLoad}
function canvasBlob(cv,type="image/jpeg",q=.9){return new Promise(r=>cv.toBlob(r,type,q))}
async function toJpeg(b,maxSide=4000){
  const bmp=await createImageBitmap(b);const k=Math.min(1,maxSide/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
  const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(bmp,0,0,cv.width,cv.height);
  return canvasBlob(cv);
}
/* high-accuracy page reading: full page + two zoomed halves, then a verification pass */
async function pageViews(b,maxViews){
  const bmp=await createImageBitmap(b);const W=bmp.width,H=bmp.height;const portrait=H>=W;
  const mk=async(sx,sy,sw,sh,max)=>{const k=Math.min(1,max/Math.max(sw,sh));const cv=document.createElement("canvas");cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(bmp,sx,sy,sw,sh,0,0,cv.width,cv.height);return canvasBlob(cv,"image/jpeg",.92)};
  const views=[await mk(0,0,W,H,1600)];
  const n=Math.max(2,Math.min(4,(maxViews||3)-1,Math.ceil(W*H/1.15e6)));const L=portrait?H:W,ov=Math.round(L*.06),step=L/n;
  for(let k=0;k<n;k++){const a0=Math.max(0,Math.round(k*step-ov)),a1=Math.min(L,Math.round((k+1)*step+ov));
    views.push(portrait?await mk(0,a0,W,a1-a0,2400):await mk(a0,0,a1-a0,H,2400))}
  return views;
}
async function readPage(promptFn,i,n,blob,signal,listKey,onStage){
  let maxN=1;try{const lim=await S.sample.limits();maxN=(lim&&lim.images&&lim.images.maxCount)||1}catch(_){}
  let views=[blob];try{if(maxN>=3)views=await pageViews(blob,Math.min(maxN,5))}catch(_){}
  const zoomNote=views.length>1?`\nYou receive ${views.length} images of the SAME page: image 1 is the full page (for layout and context); images 2 to ${views.length} are zoomed consecutive strips of the page (in reading order, top to bottom or right to left) that overlap slightly. Read every digit from the zoomed images. List each line ONLY ONCE even if it appears in both zoomed parts.`:"";
  onStage&&onStage("read");
  const first=await S.sample.json(promptFn(i,n)+zoomNote,{images:views,modelTier:"complex",signal});
  if(!first||!Array.isArray(first[listKey]))return first;
  onStage&&onStage("verify");
  try{
    const second=await S.sample.json(`Below is a JSON extraction made from these images (page ${i} of ${n}) of a handwritten / printed site measurement sheet for aluminium & glass works.${zoomNote}
Re-check EVERY entry in "${listKey}" against the images, digit by digit: codes, widths, heights, quantities, types and floor. Look for lines that were missed, duplicated or merged, and correct any mistake. Keep exactly the same JSON schema and keys as the extraction.
Add a key "corrections": a list of short ARABIC notes describing each correction you made (e.g. "W3: العرض 1450 وليس 1405"). Use an empty list if everything was already correct.
Reply with ONLY the corrected JSON.

EXTRACTION:
${JSON.stringify(first)}`,{images:views,modelTier:"complex",signal});
    if(second&&Array.isArray(second[listKey])){const corr=(second.corrections||[]).filter(Boolean);second.flags=[...(second.flags||first.flags||[]),...corr.map(c=>"مراجعة: "+c)];return second}
  }catch(e){if(e&&e.code==="cancelled")throw e}
  return first;
}
async function sheetImages(f){
  const b=await fetchFile(f);const kind=fileKind({name:f.name,type:f.type||b.type});
  if(kind==="img")return [await toJpeg(b)];
  if(kind==="pdf"){
    const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(await b.arrayBuffer())}).promise;const out=[];
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const base=pg.getViewport({scale:1});const vp=pg.getViewport({scale:3200/Math.max(base.width,base.height)});
      const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
      await pg.render({canvasContext:ctx,viewport:vp}).promise;out.push(await canvasBlob(cv))}
    return out;
  }
  return [];
}
function exPrompt(i,n){return `You are reading page ${i} of ${n}: a photographed HANDWRITTEN site measurement sheet (Arabic/English) for aluminium windows and doors at Al Qimma Tower Factory (مصنع برج القمة), Saudi Arabia.

- ref: the code and the window/door number in ONE string formatted "floor-code", e.g. "14-D3". If no floor is written, just the code, e.g. "W1".

${CODE_PROMPT}
- unclear: true if any digit is uncertain; alt: your alternative reading in that case.
- pending: true if the line is marked pending / unconfirmed / C.O.
Also return:
- stated_total: a total count of pieces written on the page (number) or null; stated_total_text: that text as written.
- flags: short notes IN ARABIC about widths/heights that break the pattern of similar units, missing floors or skipped numbers, unreadable digits (give best reading + alternative), and pending items. Empty list if none.
Reply with ONLY this JSON:
{"sheet_type":"aluminium","rows":[{"ref":"14-D3","w_cm":145.5,"h_cm":120,"qty":1,"group":"regular","type":"sliding2","note":"","unclear":false,"alt":"","pending":false,"glass_type":"","thickness":""}],"stated_total":null,"stated_total_text":"","flags":[]}
type (aluminium sheets): best match from this list, using the item code or written description: ${KIND_LIST.map(([k,v])=>k+" = "+v[1]).join("; ")}; use "other" when unsure.
sheet_type: "glass" when the sheet is a GLASS cutting / order list (titles such as زجاج، Glass، سيكوريت، دبل، مقاسات الزجاج، or a glass supplier form listing pane sizes with glass type/thickness); otherwise "aluminium" (window/door opening sizes). For glass sheets fill glass_type (e.g. "دبل 24 مم سيكوريت", "SN-70T") and thickness when written on the line or in the header.`}

async function svgToJpeg(svg,scale=2.5,VW=1190,VH=842){
  const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"}));
  try{const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
    const cv=document.createElement("canvas");cv.width=VW*scale;cv.height=VH*scale;const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL("image/jpeg",.92)}finally{URL.revokeObjectURL(url)}
}

function quotePrompt(i,n){return `You are reading page ${i} of ${n} of a price quotation (عرض سعر) from Al Qimma Tower Factory (مصنع برج القمة), an aluminium & glass factory in Saudi Arabia. List EVERY window, door or facade item priced on this page.
For each item return:
- ref: the item code as written (e.g. W1, D2, ش1). If none, use the line number as "#3".
- title: short Arabic description as written.
- kind: the best match of these keys: ${KIND_PROMPT}.
- w_mm, h_mm: width and height in MILLIMETERS. Detect the unit used: cm → ×10, m → ×1000. null if not given.
- qty: number of units.
- location: floor/room if written, else "".
- system: aluminium system as written (e.g. "سرايا 10 سم", "رويال 12 سم"), else "".
- glass_type, glass_thickness, glass_color: as written (e.g. "دبل", "24 مم", "شفاف"), else "".
- paint_color, paint_code: colour and RAL code as written, else "".
- acc_type, acc_color: accessories type/brand and colour as written, else "".
Also flags: short ARABIC notes about anything unclear (missing sizes, unclear units, unreadable numbers).
Reply with ONLY this JSON:
{"items":[{"ref":"W1","title":"","kind":"sliding2","w_mm":1500,"h_mm":1200,"qty":2,"location":"","system":"","glass_type":"","glass_thickness":"","glass_color":"","paint_color":"","paint_code":"","acc_type":"","acc_color":""}],"flags":[]}`}

async function readQuote(c){
  const files=((c.files||{}).quote||[]);if(!files.length){toast("ارفع عرض السعر أولاً في تبويب «العقد والعرض والمخططات»");return}
  if(!S.sample){toast("قراءة عرض السعر متاحة فقط داخل Claude");return}
  const cid=c._id;const st=S.ex["shop:"+cid]={busy:true,msg:"جارٍ تجهيز صفحات العرض…",ctl:new AbortController()};render();
  try{
    const pages=[];for(const f of files){const imgs=await sheetImages(f);imgs.forEach(b=>pages.push(b))}
    if(!pages.length)throw{code:"image_rejected"};
    const items=[],flags=[];
    for(let i=0;i<pages.length;i++){st.msg=`جارٍ قراءة صفحة ${i+1} من ${pages.length} من عرض السعر…`;render();
      const out=await S.sample.json(quotePrompt(i+1,pages.length),{images:[pages[i]],modelTier:"complex",signal:st.ctl.signal});
      (out&&out.items||[]).forEach(x=>items.push(newShopItem(c,{ref:String(x.ref||""),title:String(x.title||""),kind:x.kind,w:x.w_mm,h:x.h_mm,qty:x.qty,location:String(x.location||""),
        spec:{system:x.system,glassType:x.glass_type,glassThk:x.glass_thickness,glassColor:x.glass_color,paintColor:x.paint_color,paintCode:x.paint_code,accType:x.acc_type,accColor:x.acc_color}})));
      (out&&out.flags||[]).forEach(t=>t&&flags.push(`ص${i+1}: ${t}`));}
    items.forEach(it=>{if(!(it.w>0&&it.h>0))flags.push(`«${it.ref}» بدون مقاس واضح في العرض، أدخله يدوياً.`)});
    S.ex["shop:"+cid]={busy:false};
    await write(cid,{shop:{items:[...((c.shop&&c.shop.items)||[]),...items],flags,at:new Date().toISOString(),source:"quote"}});
    toast(`أُنشئ ${items.length} مخطط من عرض السعر. راجعها وعدّل عليها.`);
  }catch(e){S.ex["shop:"+cid]={busy:false,err:e&&e.code==="image_rejected"?"لا يمكن قراءة ملف العرض. ارفعه بصيغة PDF أو صورة.":sampleErr(e)}}
  render();
}

function accTable(list,empty,priced){return `<div class="tablebox"><table><thead><tr><th>الصنف</th><th>الكمية</th><th>الوحدة</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>
  ${list.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td class="num">${a.qty}</td><td>${esc(a.unit)}</td><td>${a.price?M(a.price):"—"}</td><td>${a.price?M(a.total):"—"}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">${empty}</td></tr>`}
  </tbody><tfoot><tr><td colspan="4">الإجمالي</td><td>${priced(sum(list,a=>a.total))}</td></tr></tfoot></table></div>`}

function calcHead(c,T,cfg,extra=""){const alu=c.colors?.alu||{};const colorTxt=[alu.color,alu.code].filter(Boolean).join(" · ")||"لم يُحدد اللون";
  return `<div class="card"><div class="head"><div><h3 style="display:block">ملخص الحصر</h3>
    <div class="small muted">طول العود <span class="num">${money(cfg.barLen)}</span> مم · قص المنشار <span class="num">${cfg.kerf}</span> مم · تشذيب الأطراف <span class="num">${cfg.trim}</span> مم · لون الألمنيوم: ${esc(colorTxt)}</div></div>
    <div class="toolbar">${S.downloads?`<button data-act="export-calc">تنزيل Excel (CSV)</button>`:""}<button data-act="open-settings">قوالب الحساب والأسعار</button></div></div>
    ${!c.measFinal?`<div class="note">المقاسات غير معتمدة نهائياً بعد. راجعها قبل إرسال الطلبية للتصنيع.</div>`:""}
    ${T.warn.length?`<div class="note">${T.warn.map(esc).join("<br>")}</div>`:""}
    ${!S.cfgSaved?`<div class="note">الحساب يستخدم القوالب الافتراضية (خصومات وأوزان تقريبية). راجعها من «قوالب الحساب والأسعار» واحفظها لتطابق قطاعات المصنع.</div>`:""}
    ${extra}</div>`}
const noMeas=`<div class="card empty"><h2>لا توجد مقاسات بعد</h2><p class="muted" style="max-width:50ch">أضف الشبابيك والأبواب من تبويب «المقاسات» واختر لكل واحد قالب الحساب، وهنا تطلع الحسابات تلقائياً.</p><button data-act="tab" data-tab="meas">← الذهاب للمقاسات</button></div>`;

function tabCalc(c){
  const cfg=S.cfg;const T=takeoff(c,cfg);const alu=c.colors?.alu||{};
  const colorTxt=[alu.color,alu.code].filter(Boolean).join(" · ")||"لم يُحدد اللون";
  if(!(c.alu||[]).length&&!(c.glass||[]).length)return pendingReadNote(c)||noMeas;
  const priced=n=>n?M(n):`<span class="muted small">أدخل السعر</span>`;
  const byCat=k=>T.acc.filter(a=>a.cat===k);
  const head=calcHead(c,T,cfg,`<div class="stats"><div class="stat"><span>الوحدات</span><b class="num">${T.units}</b></div><div class="stat"><span>عيدان الألمنيوم</span><b class="num">${T.bars}</b></div><div class="stat"><span>وزن الألمنيوم</span><b><span class="num">${money(Math.round(T.kg*10)/10)}</span><span class="cur">كجم</span></b></div><div class="stat"><span>مساحة الزجاج</span><b><span class="num">${T.m2.toFixed(2)}</span><span class="cur">م²</span></b></div><div class="stat"><span>تكلفة المواد التقديرية</span><b>${M(T.cost.total)}</b></div></div>`);
  const sec=(n,t,body)=>`<div class="card"><h3><span><span class="step">${n}</span> ${t}</span></h3>${body}</div>`;
  const s1=sec("1","حساب الألمنيوم",`<div class="tablebox"><table><thead><tr><th>القطاع</th><th>اللون</th><th>عدد القطع</th><th>الطول الصافي م</th><th>عدد العيدان</th><th>الطلب (عود)</th><th>الهدر</th><th>الوزن كجم</th><th>التكلفة</th></tr></thead><tbody>
    ${T.profiles.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(alu.code||alu.color||"—")}</td><td class="num">${p.pieces}</td><td class="num">${(p.net/1000).toFixed(2)}</td><td class="num"><b>${p.nb}</b>${p.over.length?` <span class="pill bad">${p.over.length} أطول من العود</span>`:""}</td><td><input type="number" min="0" inputmode="numeric" lang="en" style="width:64px" data-aord="${esc(p.name)}" value="${esc((c.aluOrder||{})[p.name]??p.nb)}" ${S.canWrite?"":"disabled"} aria-label="عدد العيدان المطلوبة"></td><td class="num">${(p.waste*100).toFixed(0)}%</td><td class="num">${p.kgm?p.kg.toFixed(1):"—"}</td><td>${p.kgm?priced(p.cost):"—"}</td></tr>`).join("")||`<tr><td colspan="8" class="muted">لا توجد قطع.</td></tr>`}
    </tbody><tfoot><tr><td colspan="4">الإجمالي</td><td class="num">${T.bars}</td><td class="num"><b>${sum(aluOrderRows(c,T),r=>r.bars)}</b></td><td></td><td class="num">${T.kg.toFixed(1)}</td><td>${priced(T.cost.alu)}</td></tr></tfoot></table></div>
    <div class="order-box"><b>طلب الألمنيوم من المورّد</b>
      <div class="miss-grid">${fieldInputs(orderFields(c,"alu"))}</div>
      <div class="toolbar" style="justify-content:flex-start"><button class="primary" data-act="ao-pdf" ${S.pdfBusy?"disabled":""}>طلب الألمنيوم PDF</button><button data-act="ao-xlsx">طلب الألمنيوم Excel</button>${S.canWrite&&S.assets?`<button data-act="ao-save" ${S.pdfBusy?"disabled":""}>حفظ الطلب في ملف العميل</button>`:""}<span style="flex:1"></span><button class="ghost" data-act="tab" data-tab="cut">خطة القص Cutting List ←</button></div>
      <p class="small muted" style="margin:0">عمود «الطلب» يبدأ بعدد العيدان المحسوب، وتقدر تزيد عليه احتياط أو تعدّله قبل إصدار الطلب.</p></div>`);
  const s2=sec("2","حساب الدهان",`<dl class="kv"><dt>اللون</dt><dd>${esc(colorTxt)}${alu.finish?" · "+esc(alu.finish):""}</dd><dt>عدد العيدان للدهان</dt><dd class="num">${T.bars}</dd><dt>الوزن الإجمالي</dt><dd><span class="num">${T.kg.toFixed(1)}</span> كجم</dd><dt>سعر الدهان للكيلو</dt><dd>${cfg.paintRate?M(cfg.paintRate):`<span class="muted small">أدخل السعر</span>`}</dd><dt>تكلفة الدهان</dt><dd>${priced(T.cost.paint)}</dd></dl>`);
  const s3=sec("3","حساب الإكسسوارات",accTable(byCat("acc"),"لا توجد إكسسوارات.",priced));
  const s4=sec("4","حساب المسامير والزوايا",accTable(byCat("screw"),"لا توجد مسامير أو زوايا في القوالب. أضفها من «قوالب الحساب».",priced));
  const tp=T.tape;
  const s5=sec("5","حساب تيب الحماية",`<dl class="kv"><dt>طول قطاعات الألمنيوم الصافي</dt><dd><span class="num">${tp.aluM.toFixed(1)}</span> م</dd><dt>معامل التيب</dt><dd class="num">${tp.factor} م تيب / م ألمنيوم</dd><dt>طول التيب المطلوب</dt><dd><span class="num">${tp.m.toFixed(1)}</span> م</dd><dt>عدد الرولات</dt><dd><b class="num">${tp.rolls}</b> رول (<span class="num">${tp.roll}</span> م للرول)</dd><dt>التكلفة</dt><dd>${priced(tp.cost)}</dd></dl>${byCat("tape").length?accTable(byCat("tape"),"",priced):""}`);
  const s6=sec("6","حساب الزجاج",`<div class="tablebox"><table><thead><tr><th>المرجع</th><th>المواصفة</th><th>العرض مم</th><th>الارتفاع مم</th><th>العدد</th><th>المساحة م²</th><th></th></tr></thead><tbody>
    ${T.glass.map(x=>`<tr><td><b>${esc(x.ref)}</b></td><td>${esc(x.spec)}</td><td class="num">${x.w}</td><td class="num">${x.h}</td><td class="num">${x.qty}</td><td class="num">${x.m2.toFixed(2)}</td><td class="small muted">${x.src==="manual"?"يدوي":""}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">لا يوجد زجاج.</td></tr>`}
    </tbody><tfoot><tr><td colspan="4">الإجمالي</td><td class="num">${sum(T.glass,x=>x.qty)}</td><td class="num">${T.m2.toFixed(2)}</td><td>${priced(T.cost.glass)}</td></tr></tfoot></table></div>
    ${Object.keys(glassGroups(c)).length||(c.glass||[]).length?`<div class="order-box"><b>طلب الزجاج من المورّد</b><p class="small muted" style="margin:0">المقاسات من: ${glassSrc(c)==="saved"?"مقاسات الزجاج المحفوظة":"المحسوبة من الألمنيوم"} (تغييرها من تبويب «المقاسات» ← طلبات المورّدين)</p><div class="miss-grid">${fieldInputs(orderFields(c,"glass"))}</div><div class="toolbar" style="justify-content:flex-start"><button class="primary" data-act="go-xlsx">طلب الزجاج Excel</button><button data-act="go-pdf" ${S.pdfBusy?"disabled":""}>طلب الزجاج PDF</button></div></div>`:""}`);
  const s7=sec("7","حساب الربل",accTable(byCat("rubber"),"لا يوجد ربل في القوالب.",priced));
  const k=calc(c);const net=N(c.quoteNet)||k.contract;const C=T.cost;
  const s8=`<div class="card"><h3>التكلفة التقديرية للمواد</h3>
    <dl class="kv"><dt>الألمنيوم</dt><dd>${M(C.alu)}</dd><dt>الدهان</dt><dd>${M(C.paint)}</dd><dt>الإكسسوارات</dt><dd>${M(C.acc)}</dd><dt>المسامير والزوايا</dt><dd>${M(C.screw)}</dd><dt>تيب الحماية</dt><dd>${M(C.tape)}</dd><dt>الزجاج</dt><dd>${M(C.glass)}</dd><dt>الربل</dt><dd>${M(C.rubber)}</dd><dt>إجمالي المواد</dt><dd style="font-size:1.1rem">${M(C.total)}</dd>
    ${net?`<dt>${c.quoteNet?"قيمة العرض قبل الضريبة":"قيمة العقد"}</dt><dd>${M(net)}</dd><dt>الفرق قبل العمالة والتركيب</dt><dd class="${net-C.total>=0?"pos":"neg"}">${M(net-C.total)}</dd>`:""}</dl>
    <p class="small muted" style="margin:0">التكلفة تقديرية من أسعار الإعدادات. الربح الفعلي يُحسب من فواتير المشتريات في تبويب «المشتريات والأرباح».</p></div>`;
  return head+s1+s2+s3+s4+s5+s6+s7+s8;
}

function pendingReadNote(c){const X=c.measExtract;return X&&X.rows&&X.rows.length&&!X.appliedAt?`<div class="card"><div class="note">قُرئ كشف المقاسات النهائية (<span class="num">${X.rows.length}</span> سطر) لكن النتيجة لم تُضف للمقاسات النهائية بعد، لذلك لا يظهر الحساب.</div><div class="toolbar" style="justify-content:flex-start"><button class="primary" data-act="ex-apply">إضافة النتيجة إلى المقاسات النهائية</button><button data-act="tab" data-tab="meas">مراجعتها أولاً في المقاسات النهائية</button></div></div>`:""}
function tabCut(c){
  const cfg=S.cfg;const T=takeoff(c,cfg);
  if(!(c.alu||[]).length)return pendingReadNote(c)||noMeas;
  return calcHead(c,T,cfg,`<div class="stats"><div class="stat"><span>القطاعات</span><b class="num">${T.profiles.length}</b></div><div class="stat"><span>عدد القطع</span><b class="num">${sum(T.profiles,p=>p.pieces)}</b></div><div class="stat"><span>عدد العيدان</span><b class="num">${T.bars}</b></div><div class="stat"><span>متوسط الهدر</span><b class="num">${T.bars?((1-sum(T.profiles,p=>p.net)/(T.bars*N(cfg.barLen)))*100).toFixed(0):0}%</b></div></div>`)+
  cutSheetTable(c)+`<div class="card"><h3>Cutting List · خطة القص على العيدان</h3>
    ${T.profiles.map((p,pi)=>`<details class="cut" ${pi===0?"open":""}><summary><b>${esc(p.name)}</b> <span class="muted small">· <span class="num">${p.nb}</span> عود · <span class="num">${p.pieces}</span> قطعة · هدر <span class="num">${(p.waste*100).toFixed(0)}%</span></span></summary>
      <div class="tablebox"><table><thead><tr><th>العود</th><th>القطع (الطول مم × العدد)</th><th>المستخدم</th><th>المتبقي</th></tr></thead><tbody>
      ${p.bars.map((b,i)=>`<tr><td class="num">${i+1}</td><td style="white-space:normal">${groupBar(b).map(e=>`<span class="cutpc"><b class="num">${e.len}</b> × <span class="num">${e.n}</span> <span class="muted small">${esc([...e.refs].join("، "))}</span></span>`).join("")}</td><td class="num">${money(b.used)}</td><td class="num ${b.off<300?"muted":""}">${money(b.off)}</td></tr>`).join("")}
      ${p.over.map(o=>`<tr><td><span class="pill bad">طويل</span></td><td class="num">${o.len} (${esc(o.ref)})</td><td colspan="2" class="small">أطول من العود، يحتاج وصلة أو عود خاص</td></tr>`).join("")}
      </tbody></table></div></details>`).join("")||`<p class="muted small">لا توجد قطع.</p>`}
  </div>
  <div class="card"><h3>تفصيل القطع لكل شباك / باب</h3>
    <div class="tablebox"><table><thead><tr><th>المرجع</th><th>القالب</th><th>المقاس</th><th>العدد</th><th>القطع للوحدة</th></tr></thead><tbody>
    ${T.perUnit.map(d=>`<tr><td><b>${esc(d.ref)}</b></td><td>${esc(d.recipe)}</td><td class="num">${d.W}×${d.H}</td><td class="num">${d.q}</td><td style="white-space:normal;min-width:260px">${d.pcs.map(x=>`<div class="small">${esc(x.p)}: <b class="num">${x.len}</b> × <span class="num">${x.n/d.q}</span></div>`).join("")}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}

function gallery(c,cat,label,hint){const list=(c.files||{})[cat]||[];
  return `<div class="card"><h3>${label} ${uploader(cat,"رفع صور","image/*")}</h3>
    ${list.length?`<div class="gallery">${list.map(p=>`<figure class="ph" style="margin:0"><img src="${blob(p.id)}" alt="${esc(p.name)}" loading="lazy" data-act="zoom" data-id="${esc(p.id)}"><div><span class="small muted num">${esc((p.at||"").slice(0,10))}</span>${del("file:"+cat+":"+p.id)}</div></figure>`).join("")}</div>`:`<p class="muted small">${hint}</p>`}</div>`}
function tabPhotos(c){
  const vids=(c.files||{}).videos||[];
  return gallery(c,"photos","الصور الأولية","صور الموقع قبل التركيب وأثناء العمل.")+
    gallery(c,"photosAfter","صور بعد التسليم","صور الأعمال المنفّذة بعد التسليم النهائي.")+
    `<div class="card"><h3>فيديوهات الموقع ${uploader("videos","رفع فيديو","video/*")}</h3>
      <p class="small muted" style="margin:0">الحد الأقصى لكل فيديو 20 ميجابايت. صوّر مقاطع قصيرة أو بجودة 720p.</p>
      ${vids.length?`<div class="gallery">${vids.map(v=>`<figure class="ph" style="margin:0"><video src="${blob(v.id)}" controls preload="metadata" playsinline></video><div><span class="small muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.name)}</span>${del("file:videos:"+v.id)}</div></figure>`).join("")}</div>`:`<p class="muted small">لا توجد فيديوهات.</p>`}</div>`;
}

/* --- final handover certificate --- */
const HO_CHECKS=["تم توريد وتركيب جميع الأعمال حسب العقد والمخططات المعتمدة","الزجاج سليم وخالٍ من الكسور والخدوش","الإكسسوارات (الأقفال والمقابض والعجلات والمفصلات) تعمل بشكل سليم","تم اختبار الفتح والإغلاق والإحكام","تم إزالة تيب الحماية وتنظيف الأعمال","تم تسليم الموقع نظيفاً وخالياً من المخلفات","تم تسليم العميل شهادة الضمان"];
function hoWorks(c){const m=new Map();(c.alu||[]).forEach(r=>{const n=recipeById(r.recipe)?.name||r.type||"أعمال ألمنيوم";m.set(n,(m.get(n)||0)+(N(r.qty)||1))});return [...m.entries()]}
function tabHandover(c){
  const fk="ho:"+c._id;const h=c.handover||{};const works=hoWorks(c);
  return `<div class="card"><h3>محضر التسليم النهائي ${h.done?`<span class="ok-badge">✓ تم التسليم ${h.date?`<span class="num">${esc(h.date)}</span>`:""}</span>`:`<span class="pill s2">لم يتم التسليم</span>`}</h3>
    <div class="grid">
      ${inp(fk,"date","تاريخ التسليم",h.date||today(),"date")}${inp(fk,"receiver","اسم المستلم",h.receiver||c.name)}${inp(fk,"role","صفة المستلم",h.role||"المالك")}${inp(fk,"phone","جوال المستلم",h.phone||c.phone,"tel")}
      ${inp(fk,"engineer","مندوب المصنع",h.engineer)}${inp(fk,"warranty","مدة الضمان (سنوات)",h.warranty??"1","number",'min="0" inputmode="numeric"')}
    </div>
    <div class="card" style="background:var(--surface-2)"><h3>الأعمال المسلّمة</h3>
      ${works.length?`<dl class="kv">${works.map(([n,q])=>`<dt>${esc(n)}</dt><dd class="num">${q}</dd>`).join("")}<dt>الإجمالي</dt><dd class="num">${sum(works,w=>w[1])}</dd></dl>`:`<p class="small muted" style="margin:0">لا توجد مقاسات مسجّلة. تُسحب الأعمال من تبويب «المقاسات».</p>`}</div>
    <div class="checks">${HO_CHECKS.map((t,i)=>chk(fk,"c"+i,t,(h.checks||{})["c"+i])).join("")}</div>
    ${area_(fk,"notes","ملاحظات معلقة (إن وجدت)",h.notes)}
    ${chk(fk,"done","تم التسليم النهائي واستلام العميل",h.done)}
    <div class="toolbar">${S.canWrite?`<button class="primary" data-act="save-ho">حفظ المحضر</button>`:""}
      <button data-act="ho-pdf" ${S.pdfBusy?"disabled":""}>${S.pdfBusy?"جارٍ إنشاء PDF…":"تنزيل المحضر PDF"}</button>
      ${S.canWrite&&S.assets?`<button data-act="ho-save" ${S.pdfBusy?"disabled":""}>حفظ PDF في ملف العميل</button>`:""}</div>
  </div>
  <div class="card"><h3>المحضر الموقّع ${uploader("handover","رفع المحضر الموقّع")}</h3><p class="small muted" style="margin:0">نزّل المحضر، اطبعه ووقّعه مع العميل، ثم ارفع صورته أو نسخته الممسوحة هنا.</p>${fileList(c,"handover")}</div>`;
}
function wrapText(t,max){const out=[];String(t||"").split(/\n/).forEach(par=>{let line="";par.split(/\s+/).forEach(w=>{if((line+" "+w).trim().length>max){if(line)out.push(line);line=w}else line=(line+" "+w).trim()});if(line)out.push(line)});return out}
function hoMerged(c){const d=S.draft["ho:"+c._id]||{};const h=clone(c.handover||{});h.checks={...(h.checks||{})};
  for(const[k,v]of Object.entries(d)){if(/^c\d+$/.test(k))h.checks[k]=!!v;else h[k]=v}
  if(!h.date)h.date=today();if(h.receiver==null)h.receiver=c.name||"";if(h.role==null)h.role="المالك";if(h.phone==null)h.phone=c.phone||"";if(h.warranty==null)h.warranty=1;return h}
function handoverSVG(c){
  const h=hoMerged(c);const works=hoWorks(c);let y;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842"><rect width="595" height="842" fill="#fff"/>`;
  s+=`<rect x="0" y="0" width="595" height="8" fill="#1d5d78"/>`+R(20,20,555,802,{sw:.8})+svgLogo(276,26,44,50);
  s+=T(560,52,CO().nameAr,{size:15,anchor:"end",weight:700})+T(35,52,CO().nameEn.toUpperCase(),{size:10,weight:700})+T(35,66,"Aluminium & Glass Works",{size:8.5,fill:"#555"});

  2) the door as a separate item whose ref is the façade ref + the letter "A" (e.g. "17" → "17A", "W5" → "W5A"), type door1 (single leaf) or door2 (double leaf), same floor, desc "باب ضمن البند <ref>". Use the door size if it is written; if not, use the standard door 1000 mm wide × 2400 mm high.
  The program deducts the door area from the façade automatically, so do NOT reduce the façade size yourself.
Also return:
- client: {"name","phone","project","location"} if written on the sheet, else empty strings.
- unit: the unit you detected ("cm","m","mm").
- stated_total: total pieces written on the sheet (number) or null.
- flags: short ARABIC notes about unclear digits (best reading + alternative), unit assumptions, missing sizes, unusual sizes compared to similar openings, anything a salesperson should double-check.
Reply with ONLY this JSON:
{"items":[{"ref":"W1","floor":"G","type":"sliding2f","sys":"royal","fixPos":"up","desc":"","w_mm":1500,"h_mm":1200,"qty":1,"unclear":false,"alt":""}],"client":{"name":"","phone":"","project":"","location":""},"unit":"cm","stated_total":null,"flags":[]}`}

async function qSheetRead(){
  const q=S.qd;const sheets=q&&q.sheets||[];if(!sheets.length){toast("ارفع ورقة المقاسات أولاً");return}
  if(!S.sample){toast("قراءة الأوراق متاحة فقط داخل Claude");return}
  const st=S.ex["qs:"+S.qid]={busy:true,msg:"جارٍ تجهيز الصفحات…",ctl:new AbortController()};render();
  try{
    const pages=[];for(const f of sheets){(await sheetImages(f)).forEach(b=>pages.push(b))}
    if(!pages.length)throw{code:"image_rejected"};
    const items=[],flags=[];let client={};let stated=0;
    const last=(q.items||[]).filter(i=>N(i.price)>0).slice(-1)[0];
    for(let i=0;i<pages.length;i++){st.msg=`جارٍ قراءة الصفحة ${i+1} من ${pages.length}… (قد تأخذ دقيقة)`;render();
      const out=await readPage(qSheetPrompt,i+1,pages.length,pages[i],st.ctl.signal,"items",sg=>{st.msg=sg==="verify"?`مراجعة أرقام الصفحة ${i+1} من ${pages.length} والتأكد منها…`:`قراءة الصفحة ${i+1} من ${pages.length} بدقة عالية…`;render()});
      (out&&out.items||[]).forEach(x=>{const type=Q_TYPES[x.type]?x.type:"sliding2";
        items.push({id:uid(),ref:toLat(String(x.ref||"")).trim(),floor:flr(x.floor).slice(0,4),type,desc:String(x.desc||"")+(x.unclear?` (رقم غير واضح${x.alt?`، بديل: ${x.alt}`:""})`:""),w:Math.round(N(x.w_mm)),h:Math.round(N(x.h_mm)),qty:Math.max(1,Math.round(N(x.qty)||1)),pricing:type==="other"?"lump":KOPT(type).unit?"unit":"m2",sys:(x.sys==="royal"||x.sys==="saraya")?x.sys:defSys(q),fixPos:x.fixPos==="down"?"down":"up",price:defPrice(type,(x.sys==="royal"||x.sys==="saraya")?x.sys:defSys(q)),addon:defAddon(type),unclear:!!x.unclear})});
      if(out&&out.client)for(const k of ["name","phone","project","location"])if(out.client[k]&&!client[k])client[k]=String(out.client[k]);
      if(out&&N(out.stated_total)>0)stated+=N(out.stated_total);
      (out&&out.flags||[]).forEach(t=>t&&flags.push(`ص${i+1}: ${t}`));}
    const cnt=sum(items,x=>x.qty);if(stated&&stated!==cnt)flags.unshift(`المكتوب في الورقة ${stated} قطعة لكن المستخرج ${cnt}. راجع الأسطر.`);
    items.forEach(x=>{if(!(x.w>0&&x.h>0)&&x.type!=="other")flags.push(`«${x.ref}» بدون مقاس واضح، أدخله يدوياً.`)});
    // replace the single untouched starter line, otherwise append
    const starter=(q.items||[]).length===1&&!N(q.items[0].price)&&!q.items[0].desc;
    q.items=starter?items:[...(q.items||[]),...items];
    q.client=q.client||{};for(const k in client)if(!q.client[k])q.client[k]=client[k];
    q.sheetFlags=flags;q.sheetReadAt=new Date().toISOString();
    S.ex["qs:"+S.qid]={busy:false};await qSaveNow();
    toast(`أُضيف ${items.length} بند (${cnt} قطعة) من ورقة المقاسات. راجعها وأدخل الأسعار.`);
  }catch(e){S.ex["qs:"+S.qid]={busy:false,err:e&&e.code==="image_rejected"?"لا يمكن قراءة الملف. ارفعه صورة JPG/PNG أو PDF.":sampleErr(e)}}
  render();
}

async function upload(files){
  const out=[];
  for(const f of files){
    if(f.size>MAX_BYTES){toast(`«${f.name}» أكبر من 20 ميجابايت`);continue}
    try{const r=await S.assets.upload(f);out.push({id:r.id,name:f.name,type:r.contentType||f.type,size:r.sizeBytes,at:new Date().toISOString()})}
    catch(e){toast(e&&e.code==="unsupported_type"?`نوع الملف «${f.name}» غير مدعوم`:e&&e.code==="quota_exceeded"?"امتلأت مساحة الملفات":`تعذّر رفع «${f.name}»`)}
  }
  return out;
}

{"doc_type":"other","confidence":0.9,"summary_ar":"","fields":{},"warnings_ar":[]}`}

async function inboxAnalyze(cid,id){
  const c=S.clients.find(x=>x._id===cid);const it=ibList(c).find(x=>x.id===id);if(!it||S.ibRun.has(id))return;
  S.ibRun.add(id);if(it.status!=="analyzing")await ibPatch(cid,id,()=>({status:"analyzing",error:""}));render();

    const f=it.file;const kind=fileKind(f);const isVid=/^video\//.test(f.type||"")||/\.(mp4|mov|m4v|webm|avi)$/i.test(f.name||"");
    if(isVid)res={type:"video",conf:1,summary:"مقطع فيديو من الموقع.",fields:{},warn:[]};
    else if(kind==="other")res={type:ibGuess(f.name),conf:0,summary:"هذا النوع من الملفات لا يمكن قراءة محتواه آليًا، وتم اقتراح التصنيف من اسم الملف.",fields:{},warn:[]};
    else if(!S.sample)res={type:kind==="img"&&ibGuess(f.name)==="other"?"site_photo":ibGuess(f.name),conf:0,summary:"التحليل الآلي يعمل عند فتح البرنامج داخل Claude. اختر نوع المستند وأكمل البيانات يدويًا.",fields:{},warn:[]};

      const pages=(await sheetImages(f)).slice(0,maxN);const imgs=[];for(const b of pages)imgs.push(await toJpeg(b,2000));
      if(!imgs.length)throw{code:"image_rejected"};
      const out=await S.sample.json(ibPrompt(c,f.name,imgs.length),{images:imgs,modelTier:"complex"});
      const type=DOC_TYPES[out&&out.doc_type]?out.doc_type:"other";const fields={};
      (DOC_FIELDS[type]||[]).forEach(([k,,t])=>{let v=out.fields&&out.fields[k];if(v==null||v==="")return;v=toLat(String(v)).trim();
        if(t==="number")v=String(N(v)||"");if(t==="date"&&!/^\d{4}-\d{2}-\d{2}$/.test(v))v="";if(Array.isArray(t)&&!t.includes(v))v=t.includes(String(v))?v:"";if(v!=="")fields[k]=v});
      if(type==="purchase_invoice"&&!fields.category)fields.category="أخرى";
      const warn=(out.warnings_ar||[]).filter(Boolean).map(String);
      if(type==="purchase_invoice"&&fields.invoiceNo&&(c.purchases||[]).some(p=>String(p.invoiceNo||"").trim()===fields.invoiceNo&&(!fields.supplier||String(p.supplier||"").trim()===fields.supplier)))warn.unshift(`الفاتورة رقم ${fields.invoiceNo} مسجّلة مسبقًا في المشتريات، تحقّق من عدم التكرار.`);
      res={type,conf:Math.max(0,Math.min(1,N(out.confidence))),summary:String(out.summary_ar||""),fields,warn};
    }
    await ibPatch(cid,id,()=>({status:"ready",...res,error:""}));
  }catch(e){await ibPatch(cid,id,()=>({status:"error",error:e&&e.code==="image_rejected"?"تعذّرت قراءة الملف. ارفعه بصيغة PDF أو صورة واضحة.":String(sampleErr(e)).replace("الكشف","المستند")}))}
  S.ibRun.delete(id);render();
}

const dmy=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||today());return m?`${+m[3]}/${+m[2]}/${m[1]}`:d};
function xc(ref,s,v,kind){if(v==null||v==="")return `<c r="${ref}" s="${s}"/>`;if(kind==="f")return `<c r="${ref}" s="${s}"><f>${xe(v)}</f></c>`;if(kind==="n")return `<c r="${ref}" s="${s}"><v>${N(v)}</v></c>`;return `<c r="${ref}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(toLat(v))}</t></is></c>`}

const tplRow=(head,n)=>{const m=new RegExp(`<row r="${n}"[^>]*?(?:/>|>[\\s\\S]*?</row>)`).exec(head);return m?m[0]:""};
async function fillTemplate(path,sheetName,build,filename){
  if(!S.downloads){toast("التنزيل غير متاح هنا");return}
  try{
    const JSZip=await loadJsZip();const b64=TPL_XLSX[path];if(!b64)throw new Error("tpl");
    const z=await JSZip.loadAsync(Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0)));
    let s=await z.file("xl/worksheets/sheet1.xml").async("string");const head=(/<sheetData>([\s\S]*?)<\/sheetData>/.exec(s)||[,""])[1];
    const {rows,merges,cols}=build(head);if(cols)s=s.replace(/<cols>[\s\S]*?<\/cols>/,cols);
    s=s.replace(/<sheetData>[\s\S]*?<\/sheetData>|<sheetData\/>/,`<sheetData>${rows.join("")}</sheetData>`).replace(/<mergeCells[\s\S]*?<\/mergeCells>/,`<mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join("")}</mergeCells>`).replace(/<dimension ref="[^"]*"\/>/,"");
    z.file("xl/worksheets/sheet1.xml",s);
    const wb=(await z.file("xl/workbook.xml").async("string")).replace('name="ORDER"',`name="${xe(sheetName.slice(0,31))}"`);z.file("xl/workbook.xml",wb);
    const b=await z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    await S.downloads.save({filename:filename.replace(/[\\/:*?"<>|]/g,"-"),data:b});
  }catch(e){if(!(e&&e.code==="declined"))toast("تعذّر إنشاء ملف Excel")}
}

  o.rows.forEach((r,i)=>{if(y>760)return;s+=`<rect x="${X1}" y="${y}" width="${W}" height="20" fill="${i%2?"#fff":QC.soft}"/>`+T(cx[0].x0+cx[0].w/2,y+14,String(i+1),{size:9,anchor:"middle"})+T(cx[1].x0+cx[1].w-8,y+14,r.name,{size:9.5,anchor:"end",weight:600})+T(cx[2].x0+cx[2].w/2,y+14,r.unit,{size:9,anchor:"middle"})+T(cx[3].x0+cx[3].w/2,y+14.5,String(r.qty),{size:11,anchor:"middle",weight:700,fill:QC.teal})+L(X1,y+20,X2,y+20,{stroke:QC.line,sw:.4});y+=20});
  y+=24;(o.notes||[]).forEach((n,i)=>s+=T(X2,y+i*15,"• "+n,{size:8.8,anchor:"end"}));
  s+=L(X1,808,X2,808,{stroke:QC.line,sw:.6})+T(297,822,"مصنع برج القمة للأعمال المعدنية - الرياض - حي السلي",{size:8,anchor:"middle",fill:QC.muted});return s+"</svg>";

async function accOrderPdfBlob(c){const rows=accOrderRows(c);const {jsPDF}=await loadJsPdf();const logo=await logoHref(true);const y=new Date().getFullYear();
  const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});pdf.addImage(await svgToJpeg(listOrderSVG(c,{title:"طلب توريد إكسسوارات",en:"ACCESSORIES ORDER",no:`ACC-${y}-${String(c.fileNo||"").replace(/^\d{4}-/,"")}`,supplier:c.accSupplier||"",rows,notes:[c.accOrderNote,(c.colors?.acc?.brand||c.colors?.acc?.color)?`نوع/لون الإكسسوارات: ${[c.colors.acc.brand,c.colors.acc.color].filter(Boolean).join(" - ")}`:""].filter(Boolean)},logo),3.5,595,842),"JPEG",0,0,210,297);return pdf.output("blob")}
async function accOrderPdf(c,mode){const rows=accOrderRows(c);if(!rows.length){toast("لا توجد إكسسوارات محسوبة");return}if(S.pdfBusy)return;S.pdfBusy=true;render();
  try{const b=await accOrderPdfBlob(c);const name=`طلب-إكسسوارات-${c.fileNo||""}-${clientTitle(c)}.pdf`.replace(/[\\/:*?"<>|]/g,"-");
    if(mode==="save"){const r=await S.assets.upload(new File([b],name,{type:"application/pdf"}));await mutateFiles("other",l=>l.concat([{id:r.id,name,type:"application/pdf",size:r.sizeBytes,at:new Date().toISOString()}]));toast("تم حفظ طلب الإكسسوارات في «مستندات أخرى»")}

  S.pdfBusy=false;render()}

const shareBtns=kind=>`<span class="share"><button class="wa" data-act="share" data-kind="${kind}" data-via="wa" title="مشاركة على واتساب"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/></svg>واتساب</button><button class="gm" data-act="share" data-kind="${kind}" data-via="gm" title="إرسال بالإيميل (Gmail)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4.2-8 5-8-5V6l8 5 8-5Z"/></svg>Gmail</button></span>`;
const waPhone=p=>{let d=toLat(p).replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.startsWith("05"))d="966"+d.slice(1);else if(d.startsWith("5")&&d.length===9)d="966"+d;return d};
function orderText(c,kind){const head=`${CO().nameAr}\n`;const who=`العميل: ${clientTitle(c)}${c.fileNo?` · ملف ${c.fileNo}`:""}\nالتاريخ: ${dmy(today())}`;
  if(kind==="alu"){const T=takeoff(c,S.cfg);const rows=aluOrderRows(c,T);const col=aluColorSuffix(c);return `${head}طلب توريد قطاعات ألمنيوم\n${who}\nاللون: ${col||"—"}${c.colors?.alu?.finish?` · ${c.colors.alu.finish}`:""}\n\n${rows.map((r,i)=>`${i+1}) ${r.name} — ${r.bars} عود`).join("\n")}\n\nالإجمالي: ${sum(rows,r=>r.bars)} عود (طول ${aluOrderMeta(c).barM} م)${c.aluOrderNote?`\nملاحظة: ${c.aluOrderNote}`:""}`}
  if(kind==="glass"){const G=glassGroups(c);return `${head}GLASS PURCHASE ORDER - طلب زجاج\n${who}\n`+Object.keys(G).map(k=>{const L=glassSpecLines(c,k);const rs=G[k];return `\n▪ ${L?L.filter(Boolean).join(" + "):k}\n# | W × H | Q | REF | m²\n${rs.map((r,i)=>`${i+1} | ${r.w} × ${r.h} | ${r.qty} | ${r.ref} | ${gArea(r).toFixed(3)}`).join("\n")}\nTOTAL: ${sum(rs,r=>r.qty)} pcs · ${sum(rs,gArea).toFixed(2)} m²`}).join("\n")+(c.glassOrderNote?`\n\n${c.glassOrderNote}`:"")}
  if(kind==="acc"){const rows=accOrderRows(c);return `${head}طلب توريد إكسسوارات\n${who}\n\n${rows.map((r,i)=>`${i+1}) ${r.name} — ${r.qty} ${r.unit}`).join("\n")}${c.accOrderNote?`\n\nملاحظة: ${c.accOrderNote}`:""}`}
  if(kind==="paint"){const T=takeoff(c,S.cfg);const rows=aluOrderRows(c,T);const al=c.colors?.alu||{};return `${head}أمر دهان قطاعات ألمنيوم\n${who}\nاللون: ${[al.color,al.code].filter(Boolean).join(" - ")}${al.finish?` · ${al.finish}`:""}\nعدد العيدان: ${sum(rows,r=>r.bars)}`}
  return ""}
async function orderPdfBlob(c,kind){
  const {jsPDF}=await loadJsPdf();const logo=await logoHref(true);
  if(kind==="acc")return accOrderPdfBlob(c);
  const svgs=kind==="glass"?glassOrderSVGs(c,logo):[aluOrderSVG(c,aluOrderRows(c,takeoff(c,S.cfg)),logo)];
  const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});for(let i=0;i<svgs.length;i++){if(i)pdf.addPage("a4","portrait");pdf.addImage(await svgToJpeg(svgs[i],3.5,595,842),"JPEG",0,0,210,297)}return pdf.output("blob")}
async function shareOrder(c,kind,via){
  const names={alu:"طلب-ألمنيوم",glass:"طلب-زجاج",acc:"طلب-إكسسوارات"};const sup={alu:["aluSupplierPhone","aluSupplierEmail"],glass:["glassSupplierPhone","glassSupplierEmail"],acc:["accSupplierPhone","accSupplierEmail"]}[kind];
  const miss=kind==="acc"?[]:orderMissing(c,kind).filter(m=>m.k!=="@co");if(miss.length){toast("أكمل بيانات الطلب أولاً: "+miss.map(m=>m.l).join("، "),{kind:"warn"});return}
  const text=orderText(c,kind);const title=`${names[kind].replace(/-/g," ")} - ${clientTitle(c)}`;
  let file=null;try{S.pdfBusy=true;render();const b=await orderPdfBlob(c,kind);file=new File([b],`${names[kind]}-${c.fileNo||""}-${clientTitle(c)}.pdf`.replace(/[\\/:*?"<>|]/g,"-"),{type:"application/pdf"})}catch(e){}finally{S.pdfBusy=false;render()}
  // 1) native share sheet with the PDF attached (phones, Windows share)
  try{if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title,text});write(c._id,{[kind+"OrderedAt"]:new Date().toISOString()});return}}catch(e){if(e&&e.name==="AbortError")return}
  // 2) save the PDF, then open WhatsApp / Gmail with the full order as text
  if(file&&S.downloads){try{await S.downloads.save({filename:file.name,data:file})}catch(e){}}
  const ph=waPhone(c[sup[0]]||""),em=String(c[sup[1]]||"").trim();
  const msg=text+(file?"\n\n(ملف PDF للطلب مرفق)":"");
  const url=via==="wa"?`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`:`https://mail.google.com/mail/?view=cm&fs=1${em?`&to=${encodeURIComponent(em)}`:""}&su=${encodeURIComponent(title)}&body=${encodeURIComponent(msg)}`;
  const w=window.open(url,"_blank","noopener");
  if(!w){try{await navigator.clipboard.writeText(msg)}catch(e){}toast("تعذّر فتح الرابط تلقائياً. نسخت نص الطلب، الصقه في المحادثة وأرفق ملف PDF",{kind:"warn"})}
  else toast(file?"حُفظ ملف PDF. أرفقه في المحادثة اللي انفتحت مع نص الطلب":"انفتحت المحادثة مع نص الطلب",{kind:"info"});
  write(c._id,{[kind+"OrderedAt"]:new Date().toISOString()});
}


/* final measurements → aluminium rows; window type from: chosen template › sheet › linked quotation (same window number) › default sliding */
function clientQuotes(c){return S.quotes.filter(q=>q._id===c.quoteId||q.clientId===c._id||q.linkedClient===c._id).sort((a,b)=>(a.status==="معتمد"?0:1)-(b.status==="معتمد"?0:1))}
const refNum=r=>{const m=/(\d+)\s*$/.exec(toLat(String(r||"")));return m?String(+m[1]):""};
function quoteTypeFor(c,ref,floor){const qs=clientQuotes(c);const k=qRefKey(ref),n=refNum(ref);
  for(const q of qs){const its=(q.items||[]).filter(it=>it.type!=="other"&&KINDS[it.type]);
    const hit=its.find(it=>qRefKey(it.ref)===k&&(!floor||!it.floor||flr(it.floor)===flr(floor)))||its.find(it=>qRefKey(it.ref)===k)||(n?its.find(it=>refNum(it.ref)===n&&!/[A-Z]$/.test(qRefKey(it.ref))):null);
    if(hit)return hit.type}return""}
async function exApplyFinal(c,X,XK,auto){
  const notReady=X.rows.filter(r=>!exReady(r));const pend=[...(c.pendingSite||[])];notReady.forEach(r=>{if(!pend.some(p=>p.ref&&p.ref===r.ref))pend.push({ref:r.ref,qty:r.qty,group:r.group,note:r.note,at:new Date().toISOString()})});
  let fromQ=0,fromSheet=0,def=0;
  const add=X.rows.filter(exReady).map(r=>{const s=splitRef(r.ref);let rid=r.recipe||"";
    if(!rid&&r.type&&KINDS[r.type]){rid=KINDS[r.type][2];fromSheet++}
    if(!rid){const qt=quoteTypeFor(c,s.ref||r.ref,s.floor);if(qt){rid=KINDS[qt][2];fromQ++}}
    if(!rid){rid=exRecipeDefault(r);def++}
    const rc=recipeById(rid)||recipeById(exRecipeDefault(r));
    return{id:uid(),ref:s.ref||r.ref,floor:s.floor,w:N(r.w),h:N(r.h),qty:N(r.qty)||1,recipe:rc?rc.id:"",system:rc?rc.system:"",type:rc?rc.name:"",group:r.group,note:[r.pending?"بانتظار الاعتماد":"",r.unclear?"رقم غير واضح":"",r.note].filter(Boolean).join(" · ")}});
  if(await write(c._id,{alu:[...(c.alu||[]),...add],pendingSite:pend,[XK.e]:{...X,appliedAt:new Date().toISOString()}})){
    const src=[fromSheet?`${fromSheet} من الكشف`:"",fromQ?`${fromQ} من عرض السعر`:"",def?`${def} افتراضي (شباك سحاب) راجعها`:""].filter(Boolean).join("، ");
    toast(`${auto?"أُضيفت تلقائياً ":"أُضيف "}${add.length} شباك إلى المقاسات النهائية. أنواع الشبابيك: ${src||"—"}`,{kind:def?"warn":"ok",action:{label:"Cutting List",fn:()=>{S.tab="cut";render();window.scrollTo(0,0)}}})}
}

/* ---------- boot ---------- */
fromHash();
(async()=>{
  const use=window.claude&&window.claude.use;
  if(!use){S.err="nodb";render();return}
  db=await window.claude.use("db");
  if(!db){S.err="nodb";render();return}
  S.err=null;
  const t=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
  db.collection("clients").onSnapshot(snap=>{
    S.clients=snap.docs.map(d=>({...d.data(),_id:d.id}));
    if(!snap.metadata.fromCache){S.loaded=true;S.slow=false;clearTimeout(t)}
    render();
  },err=>{clearTimeout(t);S.loaded=true;S.err=err.code||"error";render()});
  db.collection("quotes").onSnapshot(snap=>{
    S.quotes=snap.docs.map(d=>({...d.data(),_id:d.id}));
    if(S.qid){const q=S.quotes.find(x=>x._id===S.qid);if(q&&!S.qDirty&&!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.q))S.qd=clone(q);if(!S.qd&&q)S.qd=clone(q)}
    render();
  },()=>{});
  db.doc("settings/takeoff").onSnapshot(snap=>{
    if(snap.exists){const d=snap.data();S.cfg={...clone(DEFAULT_CFG),...clone(d),company:{...clone(DEFAULT_CFG.company),...clone(d.company||{})},prices:{...clone(DEFAULT_CFG.prices),...clone(d.prices||{})}};S.cfgSaved=Array.isArray(d.recipes)}
    if(CO().logo&&(!S.logoData||S.logoData.id!==CO().logo))logoHref(true).then(()=>render());
    render();
  },()=>{});
  render();
  const user=await window.claude.use("user");
  if(user){try{const w=await user.can("data.write");if(w===false){S.canWrite=false;render()}}catch(e){}}
  S.assets=await window.claude.use("assets");render();
  S.downloads=await window.claude.use("downloads");render();
  S.sample=await window.claude.use("sample");render();
})();
})();
